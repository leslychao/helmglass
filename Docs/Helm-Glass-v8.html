/* Supplied brand artwork, one field focus contour and inline disclosures. */
:root{--field-focus:#4f80cd}
.h-brand-logo{width:42px;height:42px;object-fit:contain;flex:none;display:block}
.brand{gap:11px}.h-shell .sidebar .brand{gap:10px;padding-inline:8px}
.h-shell .sidebar .h-brand-word strong{font-size:21px;letter-spacing:-.7px}
.h-shell .sidebar .h-brand-word small{font-size:10px;letter-spacing:.14em}
.widget-head .h-brand-logo{width:32px;height:32px}.widget-head .h-brand-word strong{font-size:17px}.widget-head .h-brand-word small{font-size:9px}
input:not([type=checkbox]):not([type=radio]):focus,textarea:focus,select:focus,
.field input:not([type=checkbox]):not([type=radio]):focus,.field textarea:focus,.field select:focus{
 outline:0;outline-offset:0;border-color:var(--field-focus);box-shadow:inset 0 0 0 1px var(--field-focus)
}
.search:focus-within,.h-search.search:focus-within,.url-input-v:focus-within,.browser-url-v:focus-within{
 outline:0;outline-offset:0;border-color:var(--field-focus);box-shadow:inset 0 0 0 1px var(--field-focus)
}
.search input:focus,.search input:focus-visible,.h-search.search input:focus,.url-input-v input:focus,.browser-url-v input:focus{
 border:0!important;outline:0!important;box-shadow:none!important;outline-offset:0;background:transparent
}
input[aria-invalid=true]:focus,textarea[aria-invalid=true]:focus{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{outline:2px solid var(--field-focus);outline-offset:2px}
input,textarea,select,.search,.url-input-v,.browser-url-v{transition:border-color .12s,box-shadow .12s}
.h-client-guides{display:grid;gap:12px;margin-top:18px;scroll-margin-top:18px}
.h-client-card{overflow:hidden;min-width:0;scroll-margin-top:18px}
.h-client-head{display:flex;align-items:center;gap:15px;padding:17px 20px;min-width:0}
.h-client-head>.service-cell,.h-client-head .service-cell>div{min-width:0}.h-client-head h2{font-size:12px;line-height:1.6;font-weight:600}
.h-client-head .site-mark{width:32px;height:32px;min-width:32px}
.h-client-head small{font-size:11px;display:block;color:#7d8da5}
.h-client-toggle.btn{margin-left:auto;gap:9px;min-height:34px;padding:7px 10px;font-size:11px;flex:none}
.h-client-toggle .icon{width:14px;height:14px;transition:transform .15s}
.h-client-toggle[aria-expanded=true] .icon{transform:rotate(180deg)}
.h-client-body{border-top:1px solid var(--line);padding:23px 24px;background:#fff}
.h-guide-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;min-width:0}
.h-guide-grid>section{min-width:0}.h-guide-grid h3{font-size:13px;font-weight:600;margin:0 0 16px;color:#425774}
.h-guide-steps{list-style:none;padding:0;margin:0;display:grid;gap:18px}
.h-guide-steps li{display:flex;gap:11px;align-items:flex-start;min-width:0}
.h-guide-step-no{width:24px;height:24px;min-width:24px;background:#f0f5ff;color:#4774b7;border-radius:50%;font-size:11px;display:grid;place-items:center}
.h-guide-steps strong{font-size:12px;font-weight:550;line-height:1.65;display:block}
.h-guide-steps p,.h-guide-note{font-size:11px;line-height:1.8;color:#75869f;margin-top:4px}
.h-guide-code{position:relative;display:flex;align-items:flex-start;gap:12px;padding:11px 12px;background:#f8fafc;border:1px solid #e5ebf3;border-radius:7px;min-width:0}
.h-guide-code code{display:block;font:11px/1.85 ui-monospace,SFMono-Regular,Consolas,monospace;min-width:0;overflow-wrap:anywhere;color:#465e7d;flex:1;padding-block:2px;white-space:pre-wrap}
.h-guide-code .icon-btn{width:28px;height:28px;min-width:28px;padding:6px;border-radius:5px}.h-guide-code .icon{width:14px;height:14px}
.h-guide-example{margin-top:17px}.h-guide-example>span{font-size:11px;color:#7a8ba3;display:block;margin-bottom:7px}
.h-guide-note{display:flex;gap:6px;align-items:flex-start;margin-top:10px}.h-guide-note .icon{width:13px;height:13px;flex:none;margin-top:3px}
.h-client-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid #edf1f6}
.h-client-footer .btn{font-size:11px;min-height:32px}.h-client-footer>span{color:#8593a7;font-size:11px;margin-right:auto}
.browser-context-action{display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:260px}.browser-context-action .small{font-size:11px;line-height:1.35}.browser-context-action .btn{white-space:normal;text-align:left}.h-connection-rename-context{margin-bottom:19px}.h-connection-menu .danger-item{color:var(--red)!important}
.h-execution-duration{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#425b7c}
.h-execution-duration time{font-weight:550;font-size:12px}
.task-meta-v .h-duration-top{padding:5px 9px;border-radius:6px;background:#edf4fe;color:#456694;gap:7px;font-size:11px}
.task-chat-link{display:inline-flex;align-items:baseline;gap:3px;color:var(--blue);white-space:nowrap;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;border-radius:2px}
.task-chat-link:hover{text-decoration-color:currentColor}
.task-chat-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px;text-decoration-color:currentColor}
.task-chat-link>.icon{width:11px!important;height:11px!important;flex:none;align-self:center;color:inherit!important}
.h-duration-top .icon{width:14px;height:14px}.h-duration-top .h-execution-duration{color:inherit}
.h-duration-top time{font-size:12px}.h-task-table .h-duration-header{white-space:normal;line-height:1.4}
.h-task-table td[data-task-time]{white-space:nowrap}
.h-disclosure-heading{margin:0;font:inherit}
.h-disclosure-trigger{width:100%;border:0;background:white;display:flex;align-items:center;gap:14px;padding:17px 19px;text-align:left;border-radius:9px;color:#425976;min-width:0;min-height:58px}
.h-disclosure-trigger:hover{background:#fbfcfe}.h-disclosure-trigger:focus-visible{outline-offset:-3px}
.h-disclosure-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.h-disclosure-title>.icon{width:16px;height:16px;color:#8da0bc}
.h-disclosure-title b{font-size:10px;color:#7b8fa9;font-weight:500;background:#f1f5fa;border-radius:4px;padding:2px 6px}
.h-disclosure-stats{font-size:10px;line-height:1.6;color:#8091a8;margin-left:auto;font-weight:400}
.h-disclosure-action{font-size:11px;display:flex;align-items:center;gap:8px;color:#6d83a2;margin-left:auto;flex:none}
.h-disclosure-action>.icon{width:14px;height:14px;transition:transform .15s}.h-disclosure-trigger[aria-expanded=true] .h-disclosure-action>.icon{transform:rotate(180deg)}
.h-feed-latest{display:flex;align-items:center;gap:8px;padding:0 20px 17px;font-size:11px;color:#7a8ea9;min-width:0}
.h-feed-latest .status-point{width:5px;height:5px;color:#397ce0;flex:none}
.h-feed-latest>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.h-feed-body{border-top:1px solid #edf1f6;min-width:0}
.h-feed-controls{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #edf1f6}
.h-feed-controls .h-event-search{width:240px;max-width:100%;min-width:150px;margin:0;height:33px;flex:none}
.h-feed-controls>span:last-child{font-size:10px;color:#8595aa;margin-left:auto}
.h-event-page{padding:12px 18px;display:flex;gap:10px;align-items:center;border-top:1px solid #edf1f6;font-size:11px;color:#8091a9;flex-wrap:wrap}
.h-event-page .pager{gap:5px}.h-event-page .pager .icon-btn{width:28px;min-width:28px;height:28px}

function validateStartUrl(raw){if(!raw.trim())return null;let u;try{u=new URL(raw)}catch{return 'Укажите полный адрес сайта, например https://supplier.example/cabinet.'}if(u.protocol!=='https:'&&u.protocol!=='http:')return 'Укажите HTTP(S)-адрес сайта.';if(u.username||u.password)return 'Адрес не должен содержать логин и пароль.';if(/(?:token|secret|password|otp|auth_code|magic_link)=/i.test(u.search))return 'Не используйте секретную или одноразовую ссылку входа как начальный сайт.';return null;}

 const key=U.formKey+'-'+intent;const fingerprint=JSON.stringify(d);if(S.operations[key]&&S.operations[key].fingerprint!==fingerprint){showInline('form-error','Исходная операция уже принята с другим содержимым. Проверьте сохранённую задачу.');return}await busy(button,'task-form',async()=>{let id=S.operations[key]?.runId;if(!id){id=d.id||Math.max(100,...S.runs.map(t=>t.id))+1;let t=d.id?findRun(d.id):null;if(t&&(t.status!=='DRAFT'||t.version!==d.version)){showInline('form-error','Черновик уже изменён или запущен. Откройте актуальную задачу.');return}const update={id,goal:d.goal.trim(),title:d.goal.trim().slice(0,70)||'Новая задача',startUrl:d.startUrl.trim(),connections:clone(d.connections),connectionNames:d.connections.map(id=>S.connections.find(c=>c.id===id)?.name||id),executorId:e?.id||'',executorName:e?.name||'Не выбран',mode:e?.mode||null,origin:'ANGULAR',status:intent==='draft'?'DRAFT':e.mode==='EXTERNAL_MCP'?'WAITING_AGENT':'QUEUED',outcome:null,created:t?.created||new Date().toISOString(),updated:new Date().toISOString(),ended:null,version:(t?.version||0)+1,steps:[],result:null,request:null,browser:'none',browserSec:0,humanSec:0,activeSec:0,mediaSec:null,mediaBytes:null};if(t)Object.assign(t,update);else S.runs.unshift(update);S.operations[key]={runId:id,intent,fingerprint};persist()}
 if(route.query.get('case')==='unknown'&&!U.unknownShown){U.unknownShown=true;U.unknownPending=key;S.pendingCreate={key,draft:clone(d),formKey:U.formKey};persist();lockPendingForm();return}U.dirty=false;U.draft=null;U.formPath='';delete S.pendingCreate;persist();go('/tasks/'+id,true);toast(intent==='draft'?(storageOK?'Черновик сохранён в этом браузере.':'Черновик сохранён только в памяти макета.'):e.mode==='EXTERNAL_MCP'?'Задача подготовлена. Модель и браузер не запускались.':'Задача принята в демонстрационную очередь.');},intent==='draft'?'Сохраняем черновик…':e?.mode==='EXTERNAL_MCP'?'Подготавливаем…':'Принимаем задачу…');}

function userAction(t){if(t.status==='WAITING_AGENT')return notice(t.steps.length?'Задача ожидает продолжения':'Задача подготовлена',taskChatUrl(t)?'Продолжите эту задачу в '+taskChatLink(t)+'. Сохранённые шаги и результаты останутся доступны.':'Откройте чат ChatGPT с подключённым Helm Glass Service и отправьте поручение.','neutral',`<div class="code-box full" id="chat-command">Через Helm Glass Service ${t.steps.length?'продолжи':'возьми'} мою задачу ${t.id}${t.steps.length?'': ' и выполни её'}.</div>${btn('Скопировать поручение','copy-command','copy','',`data-id="${t.id}"`)}${taskChatUrl(t)?'':'<a class="btn quiet" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Открыть ChatGPT '+icon('external')+'</a>'}`);
 if(t.status==='WAITING_USER'){const q=t.request;if(q?.type==='LOGIN')return notice('Для продолжения требуется вход','Войдите в тот же серверный браузер. Пароль и код не нужно отправлять агенту.','warning');
 if(q?.type==='CONFIRMATION'){const expired=route.query.get('case')==='request-expired'||q.expiresAt<Date.now();return notice(expired?'Подтверждение устарело':'Нужно ваше подтверждение',expired?'Срок этого запроса закончился. Нельзя применить его к новому действию. Актуальное состояние поступит автоматически.':esc(q.text)+'<br>Аккаунт: '+esc(q.account)+'. Действие: '+esc(q.action)+'.','warning',expired?'':btn('Посмотреть и подтвердить','confirm-request','shield','primary',`data-id="${t.id}" data-request="${esc(q.id)}"`))}
 if(q?.type==='QUESTION'){const expired=route.query.get('case')==='request-expired';return `<section class="notice warning">${icon('chat')}<div><strong>${esc(q.text)}</strong><p>Ответ продолжит эту же задачу. ${isExternal(t)?taskChatText(t,'После сохранения вернитесь в ChatGPT.'):''}</p><form id="answer-form" data-id="${t.id}" data-request="${esc(q.id)}" data-version="${q.version}" class="mt"><div class="field">${q.choices?.length?`<label for="answer">Ваш ответ</label><select id="answer" name="answer"><option value="">Выберите период</option>${q.choices.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:`<label for="answer">Ваш ответ</label><textarea id="answer" name="answer"></textarea>`}</div>${expired?'<div class="inline-error" role="alert">Вопрос уже изменился. Ожидаем актуальный вопрос. Старый ответ не будет отправлен.</div>':''}<div id="answer-error" class="inline-error" role="alert" hidden></div><button type="submit" class="btn primary" ${expired?'disabled':''}>Отправить ответ</button></form></div></section>`}

  if(t.status==='QUEUED')return notice('Задача в очереди','Запуск принят. Принятая команда ожидает свободного браузерного слота или подключения. Точное время старта пока неизвестно.','neutral');if(t.status==='FAILED')return notice('Выполнение завершилось ошибкой',esc(t.error),'error');if(t.status==='INTERRUPTED')return unknownEffectNoticeH(t);if(t.status==='CANCELLED')return notice('Задача остановлена','Новые действия прекращены. Уже полученные данные и фактический расход сохранены.','neutral');return '';}

function unknownEffectNoticeH(t){
  if(hasResolvedEffectH(t)){
    const lost=t.browser==='released';
    return notice('Результат действия проверен',
      'История, исходная задача и оставшийся бюджет сохранены. '+(lost?'Продолжение откроет новый браузер: прежние вкладки и поля формы потеряны, может потребоваться повторный вход.':'Можно явно продолжить в том же браузере.'),
      'neutral',route.path.startsWith('/widget/')?widgetTaskLink8(t,'Открыть задачу'):'');
  }
  const checking=!!t.reconciliation?.operationId&&['PENDING','RUNNING'].includes(t.reconciliation.state);
  return notice(checking?'Проверяем результат действия':'Результат действия неизвестен',
    esc(t.error||'Подтверждение последнего действия не получено.')+' '+(checking?'Проверка не повторяет действие на сайте.':'Уже выполненное действие могло сохраниться на сайте. Не повторяйте его до проверки.'),
    checking?'neutral':'warning',btn(checking?'Ход проверки':'Проверить результат','h-review-effect','search','',`data-id="${t.id}"`));
}

function reviewUnknownEffectH(t){
  if(!t||t.status!=='INTERRUPTED')return;
  showDialog('Проверка результата действия',
    '<p>Нужно независимое подтверждение сайта: номер заказа, запись операции или квитанция. Отсутствие записи в неполном списке не доказывает, что действие не выполнено.</p>'+
    '<p class="mt">История и уже полученные результаты сохранены. Повторная отправка действия и запуск нового браузера заблокированы, пока результат неизвестен.</p>'+
    '<p class="help-text-v mt">Демонстрационный режим: проверка сайта не подключена. Открытие этого окна не подтверждает результат и не запускает повтор действия. В рабочем сервисе доступная безопасная проверка выполняется автоматически.</p>',
    btn('Закрыть','dialog-close','','primary'));

function renderScreens(){return heading('Экраны и состояния','Каталог для проверки макета. Это не дополнительные разделы рабочего приложения.',btn('О макете','about','info'))+notice('Локальные сценарии','Кнопки изменяют вымышленные данные в вашем браузере. Поля пароля и кодов отключены. Сценарий ручного входа из каталога может переключить демонстрационного владельца браузера.','neutral')+SCREENS.map(([name,items])=>`<section class="screen-group"><h2>${name}</h2><div class="screen-grid">${items.map(([n,d,p,i])=>`<a class="screen-card" href="#${p}" data-route="${p}">${icon(i)}<div><h3>${n}</h3><p>${d}</p></div></a>`).join('')}</div></section>`).join('');}
function showAbout(){showDialog('О макете','<p>Один HTML-файл показывает личный сервис Helm Glass Service. Данные и сайты вымышлены. OAuth, MCP, удалённый браузер и noVNC в макете не подключены.</p><p>Черновики, задачи и подключения макета сохраняются только в localStorage этого браузера. Не вводите реальные секреты или рабочие конфиденциальные данные. При запрете локального хранилища сохранение между перезагрузками недоступно.</p><p>Каталог экранов и кнопки демонстрации не входят в рабочий продукт. Документ реализации находится в файле <strong>AI-Tasks-Implementation-ChatGPT.md</strong>.</p>',btn('Сбросить демоданные','reset-demo','eraser','quiet')+btn('Понятно','dialog-close','','primary'))}




async function copyText(text){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else throw Error('Clipboard unavailable');toast('Скопировано.')}catch{showDialog('Скопируйте текст',`<div class="field"><label for="copy-value">Текст</label><textarea id="copy-value" readonly>${esc(text)}</textarea></div>`,btn('Закрыть','dialog-close'));$('#copy-value').select()}}
async function cancelRun(id){const t=findRun(id);if(!t||isFinal(t)||t.status==='DRAFT'||t.cancelRequestedAt)return;t.cancelRequestedAt=new Date().toISOString();persist();render();await new Promise(resolve=>setTimeout(resolve,300));t.status='CANCELLED';t.ended=new Date().toISOString();t.request=null;t.browser='closed';if(S.browserOwner===t.id)S.browserOwner=null;persist();render();toast('Остановка демонстрации завершена. Изменения внешнего сайта не откатываются.');}
function showStep(id,sid){const t=findRun(id),s=t?.steps.find(x=>x.id===sid);if(!s)return;showDialog('Действие: '+s.title,`${pair('Состояние',s.state==='done'?'Подтверждено':'Выполняется')}${pair('Продолжительность',s.duration+' с')}${pair('Попытка',String(s.attempt))}<p class="mt">${esc(s.detail)}</p><details class="details"><summary>Технические сведения</summary>${pair('Задача','#'+t.id)}${pair('Шаг',esc(s.id))}${pair('Режим',isExternal(t)?'Внешний агент':'Модель сервиса')}</details>`,btn('Закрыть','dialog-close'))}
function showConfirmation(t){const q=t.request;if(!q||q.type!=='CONFIRMATION')return;const expected={id:q.id,version:q.version};showDialog('Подтверждение аккаунта',`<p>${esc(q.text)}</p>${pair('Аккаунт',esc(q.account))}${pair('Действие',esc(q.action))}${pair('Адрес',esc(q.target))}<p class="mt small muted">Подтверждение относится только к этому действию. Оно не применяется к другим аккаунтам, объектам или параметрам.</p><div id="confirm-error" class="inline-error" role="alert" hidden></div>`,btn('Отмена','dialog-close')+btn('Подтверждаю аккаунт','user-confirm','shield','primary'),false,{'user-confirm':async b=>busy(b,'user-confirm-'+t.id,()=>{if(t.request?.id!==expected.id||t.request?.version!==expected.version||q.expiresAt<Date.now()){showInline('confirm-error','Запрос изменился или истёк. Ожидаем актуальный запрос автоматически.');return}t.steps.push({id:newKey(),title:'Пользователь подтвердил точный аккаунт и действие',type:'system',state:'done',duration:0,attempt:1,time:'Сейчас',detail:'Подтверждение связано с '+expected.id+'. Оно не является общим разрешением на другие действия.'});t.request=null;t.status=isExternal(t)?'WAITING_AGENT':'QUEUED';t.version++;persist();closeDialog(true);render();toast('Подтверждение сохранено. '+(isExternal(t)?'Продолжите в ChatGPT.':'Задача ожидает исполнителя.'))},'Сохраняем…')})}
async function demoStart(t,b){await busy(b,'demo-'+t.id,()=>{if(S.browserOwner&&S.browserOwner!==t.id){toast('В макете браузер занят задачей #'+S.browserOwner+'. Остановите её или откройте другой сценарий.');return}S.browserOwner=t.id;if(isExternal(t)){t.steps.push({id:newKey(),title:'Выполнена конкретная команда ChatGPT: открыть каталог',type:'browser',state:'done',duration:4,attempt:1,time:'Сейчас',detail:'Worker выполнил принятую команду. Вызова модели сервиса не было.'});t.status='WAITING_AGENT';t.browser='available';t.browserSec+=4;t.activeSec+=4;}else{t.status='RUNNING';t.browser='available';t.steps.push({id:newKey(),title:'Исполнитель начал работу с настроенной моделью',type:'system',state:'done',duration:1,attempt:1,time:'Сейчас',detail:'Задача получена из общей очереди.'})}persist();render()},'Получаем ресурс…');}
async function handleAction(action,b){const id=b.dataset.id,t=findRun(id);if(modalCallbacks[action]){await modalCallbacks[action](b);return}switch(action){
 case'about':showAbout();break;case'dialog-close':closeDialog();break;case'toast-close':$('#toasts').innerHTML='';break;

 case'task-menu':showObjectMenu('task',id,b);break;

 case'open-site-browser':{const c=S.connections.find(c=>c.id===id);if(c){const active=connectionTaskH(c);go(active?'/tasks/'+active.id:'/manual?connection='+id);}break;}

 case'similar-run':go('/tasks/new?copy='+id);break;

 case'open-run':go('/tasks/'+id);break;case'open-connection':go('/connection/'+id);break;

 case'filters':openFilters();break;case'columns':openColumns();break;
 case'reset-view':U.visibleColumns={executor:true,time:true,summary:true};U.sort='new';U.size=10;U.page=0;refreshTaskRows();toast('Вид таблицы восстановлен. Фильтры не изменены.');break;
 
 case'reset-filters':U.search='';U.segment='all';U.filters={status:'',executor:'',from:'',to:''};U.page=0;syncTaskURL();if($('#task-search'))$('#task-search').value='';refreshTaskRows();break;

 case'confirm-request':showConfirmation(t);break;

function timeChartV(rows){const days=Array.from({length:6},(_,i)=>'2026-09-'+(25+i));const values=days.map(d=>rows.filter(t=>t.created.startsWith(d)).reduce((s,t)=>s+t.browserSec/60,0));const max=Math.max(1,...values)*1.25;const pts=values.map((v,i)=>[35+i*94,145-v/max*128]);return `<svg class="svg-chart-v" viewBox="0 0 525 190" role="img" aria-label="Минуты браузера по дате создания задач"><defs><linearGradient id="time-area-v" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4e3ff" stop-opacity=".65"/><stop offset="1" stop-color="#eff5ff" stop-opacity=".15"/></linearGradient></defs>${[0,1,2,3,4].map(i=>`<line class="gridline" x1="35" y1="${145-i*32}" x2="510" y2="${145-i*32}"/><text x="27" y="${149-i*32}" text-anchor="end">${(max*i/4).toFixed(0)}</text>`).join('')}${pts.map(([x],i)=>`<line class="gridline" x1="${x}" y1="17" x2="${x}" y2="145"/><text x="${x}" y="170" text-anchor="middle">${25+i} сен</text>`).join('')}<path d="M35 145 ${pts.map(([x,y])=>'L'+x+' '+y).join(' ')} L505 145Z" fill="url(#time-area-v)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#4285ff" stroke-width="2"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3" fill="#4285ff"><title>${days[i]}: ${values[i].toFixed(1)} мин</title></circle>`).join('')}</svg>`;}

 case'v-login-save':{const ctx=manualContext();if(!ctx||V.login[ctx.key]!=='verified')return;await busy(b,'login-save',()=>{const m=manualState(ctx);m.phase='closed';m.deadline=null;const c=ctx.connection;c.saved=true;c.status='SAVED';c.lastLogin=new Date().toISOString();c.account='demo@example.com';c.history.unshift('Демонстрационный профиль сохранён');if(ctx.t){ctx.t.status='WAITING_AGENT';ctx.t.request=null;ctx.t.browser='none';ctx.t.humanSec+=15;ctx.t.browserSec+=15;ctx.t.version++;ctx.t.steps.push({id:newKey(),title:'Демонстрационный вход подтверждён',type:'system',state:'done',time:'Сейчас',duration:15,attempt:1,detail:'Профиль сохранён. Следующие команды поступают из ChatGPT.'});}persist();render()},'Сохраняем…');return;}

// One route-derived breadcrumb model for the web cabinet. No company or fake home level.
const BREADCRUMB_LISTS8 = new Map();
const BREADCRUMB_LIST_PATHS8 = new Set(['/tasks', '/connections', '/admin/users', '/admin/audit']);

let NAVIGATION8 = {url: '', trail: []};

function cabinetRoute8(value) {
  if (typeof value !== 'string' || value.length > 4096 || /[\x00-\x20#\\]/.test(value)) return null;
  const [path, query = ''] = value.split('?');
  if (!/^\/(?:tasks(?:\/new|\/\d+(?:\/(?:overview|result|browser|history))?)?|connections|connection\/[\w-]+|manual|usage|profile|screens|unavailable|not-found|admin(?:\/users(?:\/[\w-]+)?|\/browsers|\/audit)?)$/.test(path)) return null;
  return {path, query: new URLSearchParams(query)};
}

function navigationKey8(url) {
  const parsed = cabinetRoute8(url);
  if (!parsed) return '';
  const {path, query} = parsed;
  const task = path.match(/^\/tasks\/(\d+)/);
  if (task) return '/tasks/' + task[1];
  if (path === '/manual') return path + '?' + (query.has('run') ? 'run=' + query.get('run') : 'connection=' + query.get('connection'));
  if (path === '/admin/audit') return path + (query.has('user') ? '?user=' + query.get('user') : '');
  if (path === '/tasks/new') return path + '?' + (query.get('draft') || query.get('copy') || 'new');
  return path;
}

function isSectionRoute8(url) {
  const parsed = cabinetRoute8(url);
  if (!parsed) return false;
  const {path, query} = parsed;
  return ['/tasks', '/connections', '/usage', '/screens', '/admin', '/admin/users', '/admin/browsers'].includes(path)
    || (path === '/admin/audit' && !query.has('user'));
}

function navigationTrail8(from, trail, target, mode = 'forward') {

  if (!key || mode === 'section' || isSectionRoute8(target)) return [];
  const entries = Array.isArray(trail) ? trail.filter(url => cabinetRoute8(url) && !url.startsWith('/tasks/new')).slice(-16) : [];
  if (navigationKey8(from) === key) return entries;
  const ancestor = entries.findIndex(url => navigationKey8(url) === key);
  if (ancestor !== -1) return entries.slice(0, ancestor);
  if (cabinetRoute8(from) && !from.startsWith('/tasks/new')) entries.push(from);
  return entries.slice(-16);

function storeNavigation8(url, trail) {

function syncListFilters8(filters) {

    if ((route.query.get(key) || '') !== text) changed = true;
    if (text) route.query.set(key, text);

  if (changed) route.query.delete('page');

function syncNavigation8() {

function availableReturn8(url) {

  if (path === '/tasks/new' || path === '/unavailable' || path === '/not-found') return false;
  if (path === '/manual') {
    const task = query.has('run') ? findRun(query.get('run')) : null;
    if (query.has('run') && !task) return false;
    const id = query.get('connection') || task?.request?.connectionId || task?.connections?.[0];

  }

  if (path.startsWith('/connection/')) return S.connections.some(c => c.id === path.split('/')[2]);

    if (!canAdminA()) return false;
    const userId = path.startsWith('/admin/users/') ? path.split('/')[3] : query.get('user');

function returnPath8() {
  const current = route.path + (route.query.size ? '?' + route.query : '');
  if (isSectionRoute8(current)) return '';
  for (const url of [...NAVIGATION8.trail].reverse()) {
    if (navigationKey8(url) !== navigationKey8(current) && availableReturn8(url)) return url;
  }

  if (p.startsWith('/tasks/')) return breadcrumbListPath8('/tasks');
  if (p.startsWith('/connection/')) return breadcrumbListPath8('/connections');

    return breadcrumbListPath8(route.query.has('run') ? '/tasks' : '/connections');

function taskConnectionH(t){
  const bindingId=t.request?.connectionId||t.siteAccess?.connectionId;
  const domain=domainH(browserVState(t).url||t.startUrl);
  let connection=null;
  for(const candidate of S.connections){
    if(bindingId&&candidate.id!==bindingId)continue;
    if(!t.connections?.includes(candidate.id)||domainH(candidate.startUrl)!==domain)continue;
    if(connection)return null;

  }

}

    &&!t.browserControl&&!t.request&&browserVState(t).mode!=='readonly'&&hasResolvedEffectH(t)

function browserActionsH(t,widget=false){
  const v=browserVState(t),state=browserState(t),connection=taskConnectionH(t);
  const unknownEffect=hasUnknownEffectH(t);

  const authenticated=live&&t.siteAccess?.connectionId===connection?.id&&t.siteAccess?.state==='AUTHENTICATED';
  const loginRequired=t.status==='WAITING_USER'&&t.request?.type==='LOGIN';
  const stopped=isFinal(t)||['STOPPING','INTERRUPTED'].includes(t.status)||!!t.cancelRequestedAt||(!widget&&U.signedOut);
  const readonly=v.mode==='readonly',fresh=!liveUnavailable7();
  const ownControl=control?.instanceId===BROWSER_INSTANCE_H;
  const loginActive=control?.purpose==='login'&&ownControl;
  const changing=control&&['taking','returning'].includes(control.mode);
  const manual=ownControl&&control.mode==='manual'&&!widget&&live&&!stopped&&!unknownEffect;
  const actions={primary:null,widget,manual,canInput:manual&&state==='available'&&fresh,
    canPause:!widget&&!stopped&&!unknownEffect&&live&&!control&&!readonly&&!loginRequired&&['RUNNING','PAUSED'].includes(t.status)&&fresh,
    authenticated,loginRequired};
  if(!widget&&canResumeInterruptedH(t)){
    actions.primary={kind:'resume',label:t.browser==='released'?'Продолжить с новым браузером':'Продолжить задачу',disabled:false,reason:''};
    return actions;
  }
  if(stopped||['DRAFT','QUEUED'].includes(t.status)||unknownEffect)return actions;
  const action=(kind,label,disabled=false,reason='')=>({kind,label,disabled,reason});
  if(changing){
    actions.primary=action('progress',control.mode==='taking'?'Передаём управление…':'Возвращаем управление…',true,'Дождитесь завершения передачи управления.');
  }else if(widget&&control){
    // MCP identity cannot establish ownership of a web controller.
    return actions;
  }else if(control&&!ownControl){
    actions.primary=action('transfer','Перенести управление сюда',!fresh,'Управление открыто в другом окне.');
  }else if(loginActive){
    actions.primary=action('login','Продолжить вход',!fresh);
  }else if(manual){
    actions.primary=action('release','Вернуть агенту',!fresh);
  }else if(readonly){

  }else if(loginRequired){
    actions.primary=action('login','Войти на сайт',!fresh);

  }

}

// One searchable, multiple-selection site field; at most three suggestions are rendered.
const SITE_PICKER_A={scope:null,query:'',index:-1,items:[],recent:{tasks:[],connections:[]}};
function siteFieldA(scope){
  const count=filterStateH(scope).site.length;
  return `<div class="a-site-field" data-site-picker="${scope}">${icon('globe')}<input id="a-site-${scope}" type="text" role="combobox" aria-label="Сайт" placeholder="Сайт" autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="header-pop" aria-expanded="false" data-site-scope="${scope}"><span class="a-site-count" ${count?'':'hidden'}>${count}</span><button type="button" data-action="a-site-open" data-scope="${scope}" aria-label="Показать последние сайты" aria-controls="header-pop">${icon('down')}</button></div>`;
}
function siteCandidatesA(scope,query=''){
  const recent=SITE_PICKER_A.recent[scope]||[],rows=scope==='tasks'?mainRunsV():S.connections.filter(c=>!c.demoOnly||V.showExtra);
  const map=new Map();
  for(const r of rows){
    const host=domainH(r.startUrl);if(host==='Не указан')continue;
    const time=Date.parse(r.updated||r.lastLogin||r.created||'')||0;
    if(!map.has(host)||map.get(host).time<time)map.set(host,{host,time,name:siteV(r.startUrl).name});
  }
  const q=query.trim().toLocaleLowerCase('ru');
  return [...map.values()].filter(s=>!q||[s.host,s.name].join(' ').toLocaleLowerCase('ru').includes(q)).sort((a,b)=>{
    const ai=recent.indexOf(a.host),bi=recent.indexOf(b.host);
    return (ai<0?999:ai)-(bi<0?999:bi)||b.time-a.time||a.host.localeCompare(b.host);
  });
}

  input.removeAttribute('aria-activedescendant');positionPopover();
}

function connectLiveSocket7(){
  if(LIVE7.stopped||TABLE_API6.mode!=='http')return;
  if(LIVE7.socket&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(LIVE7.socket.readyState))return;
  const configured=window.HELM_LIVE_API?.url;
  if(!configured){setLivePhase7('unconfigured');return;}
  let endpoint;
  try{
    endpoint=new URL(configured,location.href);if(endpoint.protocol==='https:')endpoint.protocol='wss:';else if(endpoint.protocol==='http:')endpoint.protocol='ws:';
    const origin=endpoint.protocol==='wss:'?'https:':'http:';
    if(!['ws:','wss:'].includes(endpoint.protocol)||origin+'//'+endpoint.host!==location.origin)throw Error('Канал событий должен иметь тот же origin.');
  }catch{setLivePhase7('unconfigured');return;}
  setLivePhase7('reconnecting');
  const socket=new WebSocket(endpoint.href);LIVE7.socket=socket;
  socket.onopen=()=>{
    if(LIVE7.stopped||LIVE7.socket!==socket)return;
    LIVE7.lastMessage=Date.now();
    socket.send(JSON.stringify({type:'subscribe',channels:canAdminA()?['self','administration']:['self']}));
    clearInterval(LIVE7.heartbeatTimer);
    LIVE7.heartbeatTimer=setInterval(()=>{
      if(socket.readyState!==WebSocket.OPEN)return;
      if(Date.now()-LIVE7.lastMessage>=45000){socket.close();return;}
      socket.send(JSON.stringify({type:'ping'}));
    },15000);
  };
  socket.onmessage=event=>{
    if(LIVE7.stopped||LIVE7.socket!==socket||socket.readyState!==WebSocket.OPEN)return;
    let frame;try{frame=JSON.parse(event.data);}catch{return;}
    if(!frame||typeof frame.type!=='string')return;LIVE7.lastMessage=Date.now();
    if(frame.type==='auth.required'){setLivePhase7('auth');socket.close(1000);return;}
    if(frame.type==='ready'){
      LIVE7.reconnectAttempt=0;setLivePhase7('connected');enqueueLive7();return;
    }
    if(LIVE7.phase!=='connected'||frame.type!=='invalidate'||!Array.isArray(frame.resources))return;
    enqueueLive7(frame.resources);
  };
  socket.onerror=()=>{};
  socket.onclose=event=>{
    if(LIVE7.socket!==socket)return;
    clearInterval(LIVE7.heartbeatTimer);
    if(LIVE7.stopped)return;
    if([4401,4403].includes(event.code)||LIVE7.phase==='auth'){setLivePhase7('auth');return;}
    setLivePhase7('reconnecting');clearTimeout(LIVE7.reconnectTimer);
    const delay=Math.min(30000,1000*2**Math.min(LIVE7.reconnectAttempt++,5))*(.85+Math.random()*.3);
    LIVE7.reconnectTimer=setTimeout(connectLiveSocket7,delay);
  };
}
