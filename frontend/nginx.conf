server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|png|ico|woff2)$ {
        try_files $uri =404;
        expires 1h;
    }
}
