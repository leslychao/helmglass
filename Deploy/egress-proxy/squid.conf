http_port 3128
visible_hostname helm-egress
pid_filename /run/helm/squid.pid
cache_effective_user helm
cache_effective_group helm
access_log none
cache_log /dev/null
cache_store_log none
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
forwarded_for delete
httpd_suppress_version_string on
host_verify_strict on
uri_whitespace deny
shutdown_lifetime 2 seconds
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 60 seconds

auth_param basic program /usr/local/libexec/basic_ncsa_auth /run/helm/media-proxy.htpasswd
auth_param basic realm HelmMedia
auth_param basic credentialsttl 1 minute
acl media_identity proxy_auth helm-media
acl authorization_header req_header Proxy-Authorization .
acl turn_destination dstdomain -n coturn
acl turn_address dst coturn
acl turn_port port 3478
acl CONNECT method CONNECT
acl secure_ports port 443
acl web_ports port 80 443
acl forbidden_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl forbidden_destination dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl forbidden_destination dst 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl forbidden_destination dst 224.0.0.0/4 240.0.0.0/4
acl forbidden_destination dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48
acl forbidden_destination dst 100::/64 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8

# This identity is delivered only to the media helper over the scoped worker channel.
http_access deny manager
# libnice resolves TURN before CONNECT, so the scoped route matches its service IP.
http_access allow CONNECT turn_address turn_port media_identity
http_access deny authorization_header
http_access deny turn_destination
http_access deny !web_ports
http_access deny CONNECT !secure_ports
http_access deny forbidden_destination
http_access allow all
http_access deny all
