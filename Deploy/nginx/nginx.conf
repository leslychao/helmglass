worker_processes auto;
pid /run/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 4096;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 3s;
    proxy_timeout 10m;
    proxy_next_upstream off;

    upstream turn_udp {
        zone turn_udp 32k;
        server coturn:3478 resolve;
    }
    upstream turn_tcp {
        zone turn_tcp 32k;
        server coturn:3478 resolve;
    }
    server {
        listen 3478 udp reuseport;
        ${TRUSTED_EDGE_STREAM}
        proxy_pass turn_udp;
    }
    server {
        listen 5349 ${TURN_TLS_LISTEN};
        ${TRUSTED_EDGE_STREAM}
        ${STREAM_TLS_DIRECTIVES}
        # Consume the trusted gateway's PROXY header; coturn keeps its ordinary TCP listener.
        proxy_pass turn_tcp;
    }
    ${DIRECT_TURN_TCP}
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker embedded DNS; re-resolve after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream api_backend {
        zone api_backend 64k;
        server api:8080 resolve;
        keepalive 32;
    }
    upstream mcp_backend {
        zone mcp_backend 64k;
        server mcp-adapter:8080 resolve;
        keepalive 16;
    }
    upstream oauth_backend {
        zone oauth_backend 64k;
        server oauth2-proxy:4180 resolve;
        keepalive 16;
    }
    upstream keycloak_backend {
        zone keycloak_backend 64k;
        server keycloak:8080 resolve;
        keepalive 16;
    }

    # Log only fixed route classes, never query strings or private resource URLs.
    map $uri $route_class {
        default                       "frontend";
        ~^/api/                       "api";
        ~^/events/                    "events";
        ~^/stream/                    "browser-stream";
        ~^/oauth2/                    "oauth";
        ~^/auth/                      "identity";
        /mcp                          "mcp";
    }
    log_format safe escape=json
        '{"requestId":"$request_id","route":"$route_class",'
        '"method":"$request_method","status":$status,'
        '"seconds":$request_time,"bytes":$body_bytes_sent}';
    access_log /dev/stdout safe;

    map $uri $upstream_authorization {
        # auth_request shares variables with its parent; never cache its empty credentials.
        volatile;
        default                       "Bearer $auth_token";
        /mcp                          $http_authorization;
        /.well-known/oauth-protected-resource/mcp "";
        ~^/events/v1/widget/tasks/     "";
        ~^/stream/v1/widget/signaling/ "";
        ~^/auth/                      $http_authorization;
        ~^/oauth2/                    "";
        /_oauth2_auth                 "";
    }
    map $uri $upstream_content_length {
        volatile;
        default                       $http_content_length;
        /_oauth2_auth                 "";
    }
    map $uri $ws_upgrade {
        volatile;
        default                       "";
        ~^/stream/v1/                 $http_upgrade;
        ~^/events/v1/                 $http_upgrade;
    }
    map $ws_upgrade $connection_upgrade {
        volatile;
        default upgrade;
        ""      "";
    }
    map $uri $cache_policy {
        default                       "no-store";
        ~^/auth/                      "";
        ~^/oauth2/                    "";
        "~^/(main|polyfills|chunk|styles)-[A-Za-z0-9_-]{8,}\.(js|css)$"
            "private, max-age=31536000, immutable";
    }
    map $uri $app_csp {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ${PUBLIC_WS_ORIGIN}; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";
        ~^/auth/   "";
        ~^/oauth2/ "";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;
    add_header_inherit merge;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_hide_header Authorization;
    proxy_hide_header X-Auth-Request-Access-Token;

    # These headers are inherited by all locations; do not add a partial
    # proxy_set_header list in a child location and lose this overwrite policy.
    proxy_set_header Host ${PUBLIC_AUTHORITY};
    proxy_set_header X-Forwarded-Host ${PUBLIC_AUTHORITY};
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port ${PUBLIC_PORT};
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-User "";
    proxy_set_header X-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Auth-Request-Access-Token "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-WEBAUTH-USER "";
    proxy_set_header X-WEBAUTH-EMAIL "";
    proxy_set_header X-WEBAUTH-ROLE "";
    proxy_set_header Authorization $upstream_authorization;
    proxy_set_header Content-Length $upstream_content_length;
    proxy_set_header Upgrade $ws_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz { return 200 'ready'; }
        location / { return 404; }
    }

    # The external dev gateway terminates public TLS on its dedicated Docker network.
    # Inspect the original peer, not the client address replaced by real_ip_header.
    geo $realip_remote_addr $trusted_edge_peer {
        default 0;
        ${TRUSTED_EDGE_GEO}
    }
    map "$server_port:$trusted_edge_peer" $reject_plain_http {
        default 0;
        "8080:0" 1;
    }

    server {
        listen 8080 default_server;
        ${DEFAULT_TLS_LISTEN}
        return 444;
    }

    server {
        listen 8080;
        ${HTTP_TLS_LISTEN}
        http2 on;
        server_name ${PUBLIC_HOST};
        # Keep redirects on the public origin when an external gateway terminates TLS.
        absolute_redirect off;
        ${HTTP_TLS_DIRECTIVES}

        # Empty for direct access; only the explicitly configured edge peer is trusted.
        ${TRUSTED_EDGE_DIRECTIVE}
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        if ($reject_plain_http) { return 403; }

        root /usr/share/nginx/html;
        index index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $app_csp always;
        add_header Cache-Control $cache_policy always;
        add_header X-Request-ID $request_id always;
        add_header Set-Cookie $auth_cookie always;

        auth_request /_oauth2_auth;
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_cookie $upstream_http_set_cookie;

        error_page 401 = @unauthenticated;
        error_page 403 = @forbidden;
        error_page 502 504 = @gateway_unavailable;

        location = /_oauth2_auth {
            internal;
            auth_request off;
            access_log off;
            proxy_pass_request_body off;
            proxy_pass http://oauth_backend/oauth2/auth;
        }

        # API performs OAuth forward-auth + the shared JWT/account/role checks.

        location = /oauth2/auth { auth_request off; return 404; }
        location = /oauth2/sign_out { auth_request off; return 404; }
        location ~ ^/oauth2/(start|callback|sign_in)$ {
            auth_request off;
            access_log off;
            proxy_pass http://oauth_backend;
        }
        location /oauth2/ { auth_request off; return 404; }

        location ^~ /auth/realms/helm/ {
            auth_request off;
            access_log off;
            proxy_pass http://keycloak_backend;
        }
        location ^~ /auth/resources/ {
            auth_request off;
            proxy_pass http://keycloak_backend;
        }
        location /auth/ { auth_request off; return 404; }

        location = /.well-known/oauth-protected-resource/mcp {
            auth_request off;
            proxy_pass http://mcp_backend;
        }
        location = /mcp {
            auth_request off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            gzip off;
            proxy_pass http://mcp_backend;
        }

        location ^~ /api/v1/uploads/ {
            client_max_body_size 20m;
            proxy_request_buffering off;
            proxy_hide_header Cache-Control;
            proxy_pass http://api_backend;
        }
        location ^~ /api/ {
            proxy_hide_header Cache-Control;
            proxy_pass http://api_backend;
        }
        # Ticket-only widget routes; API validates Origin, purpose, grant,
        # ownership and epochs. No anonymous data or cookie fallback.
        location ^~ /events/v1/widget/tasks/ {
            auth_request off;
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 75s;
            gzip off;
            proxy_hide_header Cache-Control;
            proxy_pass http://api_backend;
        }
        location ^~ /stream/v1/widget/signaling/ {
            auth_request off;
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 75s;
            proxy_send_timeout 15s;
            gzip off;
            proxy_pass http://api_backend;
        }
        location ^~ /events/v1/ {
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 75s;
            gzip off;
            proxy_hide_header Cache-Control;
            proxy_pass http://api_backend;
        }
        location ^~ /stream/v1/ {
            proxy_buffering off;
            proxy_read_timeout 75s;
            proxy_send_timeout 15s;
            gzip off;
            proxy_pass http://api_backend;
        }

        location /ops/ { auth_request off; return 404; }
        location /internal/ { auth_request off; return 404; }
        location /actuator/ { auth_request off; return 404; }
        location = /metrics { auth_request off; return 404; }
        location ~ /\. { auth_request off; return 404; }

        location ~ "^/(main|polyfills|chunk|styles)-[A-Za-z0-9_-]{8,}\.(js|css)$" {
            auth_request off;
            try_files $uri =404;
        }
        location /assets/ {
            auth_request off;
            try_files $uri =404;
        }
        location = /index.html {
            auth_request off;
            try_files /index.html =404;
        }
        # The public Angular shell owns navigation to login and the return path.
        # API, events and streams retain their server-side authentication above.
        location / {
            auth_request off;
            try_files $uri /index.html;
        }
        location @unauthenticated {
            auth_request off;
            default_type application/problem+json;
            return 401 '{"status":401,"code":"AUTHENTICATION_REQUIRED","requestId":"$request_id"}';
        }
        location @forbidden {
            auth_request off;
            default_type application/problem+json;
            return 403 '{"status":403,"code":"ACCESS_DENIED","requestId":"$request_id"}';
        }
        location @gateway_unavailable {
            auth_request off;
            default_type application/problem+json;
            return 503 '{"status":503,"code":"UPSTREAM_UNAVAILABLE","retryable":false,"requestId":"$request_id"}';
        }
    }
}
