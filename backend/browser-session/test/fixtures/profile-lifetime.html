<!doctype html><meta charset="utf-8"><title>Profile lifetime acceptance</title>
<button id="account-a">Use account A</button><button id="account-b">Use account B</button>
<button id="short-login">Sign in for eight seconds</button>
<label>Unsaved form <input id="draft" autocomplete="off"></label>
<button id="read-state">Read state</button><pre id="state"></pre>
<script>
  const cookie = name => document.cookie.split('; ').find(value => value.startsWith(name + '='))?.slice(name.length + 1) ?? null;
  const read = () => document.querySelector('#state').textContent = JSON.stringify({
    account: cookie('helm_fixture_account'), localAccount: localStorage.getItem('helm_fixture_account'),
    pathAccount: cookie('helm_fixture_path_account'),
    session: cookie('helm_fixture_session') === 'valid' ? 'authenticated' : 'login-required',
    draft: document.querySelector('#draft').value
  });
  for (const value of ['a', 'b']) document.querySelector('#account-' + value).onclick = () => {
    document.cookie = 'helm_fixture_account=' + value + ';path=/;SameSite=Lax;Secure';
    document.cookie = 'helm_fixture_path_account=' + value + ';path=/base64;SameSite=Lax;Secure';
    localStorage.setItem('helm_fixture_account', value);
    read();
  };
  document.querySelector('#short-login').onclick = () => {
    document.cookie = 'helm_fixture_session=valid;Max-Age=8;path=/;SameSite=Lax;Secure';
    read();
  };
  document.querySelector('#read-state').onclick = read;
  read();
</script>
