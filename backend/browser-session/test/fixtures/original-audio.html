<!doctype html>
<meta charset="utf-8">
<title>Original audio acceptance fixture</title>
<h1>Original bytes acceptance</h1>
<pre id="result">Loading</pre>
<audio id="fast" aria-label="Original WAV" controls></audio>
<audio id="slow" aria-label="Slow original WAV" controls></audio>
<button id="profile-a">Save A</button><button id="profile-b">Save B</button>
<button id="profile-read">Read identity</button><pre id="identity"></pre>
<button id="profile-oversize">Write oversized IDB value</button><button id="profile-unsupported">Write unsupported IDB value</button><pre id="profile-write"></pre>
<input id="socket-url" aria-label="WebSocket URL"><button id="socket-connect">Connect echo</button><pre id="socket-result"></pre>
<script type="module">
  // Fixed 1 MiB payload; this synthetic fixture contains no real user media.
  const samples = 524288;
  const bytes = new Uint8Array(44 + samples * 2);
  const header = new DataView(bytes.buffer);
  const text = (offset, value) => { for (let i = 0; i < value.length; i++) bytes[offset + i] = value.charCodeAt(i); };
  text(0, 'RIFF'); header.setUint32(4, bytes.length - 8, true); text(8, 'WAVE'); text(12, 'fmt ');
  header.setUint32(16, 16, true); header.setUint16(20, 1, true); header.setUint16(22, 1, true);
  header.setUint32(24, 16000, true); header.setUint32(28, 32000, true); header.setUint16(32, 2, true);
  header.setUint16(34, 16, true); text(36, 'data'); header.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) header.setInt16(44 + i * 2, Math.round(Math.sin(i * Math.PI / 20) * 4000), true);
  const blob = new Blob([bytes], { type: 'audio/wav' });
  const fast = URL.createObjectURL(blob); const slow = URL.createObjectURL(blob);
  document.querySelector('#fast').src = fast; document.querySelector('#slow').src = slow;
  const originalFetch = window.fetch.bind(window);
  window.fetch = (url, options) => {
    if (url !== slow) return originalFetch(url, options);
    let offset = 0;
    return Promise.resolve(new Response(new ReadableStream({
      async pull(controller) {
        await new Promise(resolve => setTimeout(resolve, 300));
        if (offset >= bytes.length) { controller.close(); return; }
        controller.enqueue(bytes.slice(offset, offset + 16384)); offset += 16384;
      },
      cancel() { document.body.dataset.cancelled = 'true'; }
    }), { headers: { 'content-type': 'audio/wav' } }));
  };
  const sha256 = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), byte => byte.toString(16).padStart(2, '0')).join('');
  document.querySelector('#result').textContent = JSON.stringify({ sizeBytes: bytes.length, sha256, fast, slow });
  async function database() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('helm-acceptance', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('identity');
      request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
    });
  }
  async function read() {
    const db = await database(); const transaction = db.transaction('identity'); const request = transaction.objectStore('identity').get('subject');
    const details = transaction.objectStore('identity').get('details');
    transaction.oncomplete = () => { document.querySelector('#identity').textContent = JSON.stringify({ local: localStorage.getItem('helm-acceptance'), indexed: request.result, cookie: document.cookie, complex: details.result?.date instanceof Date && details.result?.map instanceof Map && details.result?.bytes instanceof Uint8Array && details.result?.self === details.result && details.result?.big === 123n }); db.close(); };
  }
  for (const value of ['a', 'b']) document.querySelector('#profile-' + value).onclick = async () => {
    localStorage.setItem('helm-acceptance', value); document.cookie = 'helm_acceptance=' + value + ';path=/;SameSite=Lax;Secure';
    const db = await database(); const transaction = db.transaction('identity', 'readwrite'); transaction.objectStore('identity').put(value, 'subject');
    const details = { date: new Date('2026-01-01T00:00:00Z'), map: new Map([['account', value]]), bytes: new Uint8Array([1, 2, 3]), big: 123n }; details.self = details;
    transaction.objectStore('identity').put(details, 'details');
    transaction.oncomplete = () => { db.close(); read(); };
  };
  document.querySelector('#profile-read').onclick = read;
  for (const type of ['oversize', 'unsupported']) document.querySelector('#profile-' + type).onclick = async () => {
    const db = await database(); const transaction = db.transaction('identity', 'readwrite');
    transaction.objectStore('identity').put(type === 'oversize' ? 'x'.repeat(16 * 1024 * 1024) : new Blob(['unsupported profile value']), 'bad-value');
    transaction.oncomplete = () => { db.close(); document.querySelector('#profile-write').textContent = 'Stored ' + type; };
  };
  document.querySelector('#socket-connect').onclick = () => {
    const result = document.querySelector('#socket-result'); result.textContent = 'Connecting';
    try {
      const socket = new WebSocket(document.querySelector('#socket-url').value);
      const timeout = setTimeout(() => { socket.close(); result.textContent = 'Timeout'; }, 15000);
      socket.onopen = () => socket.send('helm-acceptance-echo');
      socket.onmessage = event => { clearTimeout(timeout); result.textContent = String(event.data); socket.close(); };
      socket.onerror = () => { clearTimeout(timeout); result.textContent = 'Denied'; };
    } catch { result.textContent = 'Denied'; }
  };
  document.body.dataset.ready = 'true';
</script>
