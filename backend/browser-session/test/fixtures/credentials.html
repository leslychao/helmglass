<!doctype html>
<meta charset="utf-8">
<title>Private credential acceptance</title>
<form id="login">
  <label>Username <input name="username" autocomplete="username"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password"></label>
  <button id="verify">Check synthetic credentials</button>
</form>
<p id="result">Not checked</p>
<script>
  const mode = new URL(location.href).searchParams.get('mode');
  const username = document.querySelector('[name=username]');
  if (mode === 'readonly-other' || mode === 'readonly-same') {
    username.value = mode === 'readonly-same' ? 'helm-credential-test' : 'different-account';
    username.readOnly = true;
  }
  if (mode === 'password-only') username.remove();
  document.querySelector('#login').addEventListener('submit', event => {
    event.preventDefault();
    const fields = event.currentTarget.elements;
    document.querySelector('#result').textContent = fields.username?.value === 'helm-credential-test'
      && fields.password.value === 'synthetic-not-a-secret' ? 'Expected synthetic credentials' : 'No matching credentials';
    fields.password.value = '';
  });
</script>
