<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helm Glass</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fd;color:#26354d;font:14px/1.5 system-ui,sans-serif}main{padding:18px;max-width:1050px;margin:auto}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e1e7f0;padding-bottom:14px}.brand{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#2865d8;color:white;font-size:24px;font-weight:800}h1{font-size:17px;line-height:1.35;margin:0;overflow-wrap:anywhere}.caption{font-size:12px;color:#728099}.badge{padding:3px 9px;border-radius:20px;background:#e9effb;color:#3065bd;margin-left:auto;white-space:nowrap}.panel{margin-top:14px;border:1px solid #dfe6f0;background:white;border-radius:14px;padding:16px}p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}p:last-child{margin:0}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button,a{font:inherit;border:1px solid #ccd8eb;border-radius:9px;padding:8px 12px;color:#2357a8;background:white;text-decoration:none;cursor:pointer}button.primary{background:#2865d8;color:white;border-color:#2865d8}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid #79a8ff;outline-offset:3px}.notice{color:#8a5b18;background:#fff7e7}.error{color:#9b3030;background:#fff0f0}iframe{display:block;width:100%;height:clamp(320px,65vh,700px);border:0;border-radius:12px;background:#182232}#browser{padding:0;overflow:hidden}#result{max-height:320px;overflow:auto}#state[hidden], [hidden]{display:none!important}@media(max-width:480px){main{padding:12px}.badge{max-width:120px;white-space:normal;font-size:11px}.panel{padding:12px}h1{font-size:15px}}
</style></head><body><main>
<header><div class="brand" aria-hidden="true">H</div><div><h1 id="title">Helm Glass</h1><div class="caption">Задача в исходном чате</div></div><span class="badge" id="status">Подключение</span></header>
<section class="panel" id="state" aria-live="polite"><p>Получаем актуальное состояние задачи…</p></section>
<section class="panel" id="instruction" hidden><p id="goal"></p></section>
<section class="panel notice" id="request" hidden><p id="question"></p></section>
<section class="panel" id="result" hidden><p id="summary"></p></section>
<section class="panel" id="browser" hidden><iframe id="viewer" title="Браузер задачи — просмотр"></iframe></section>
<div class="buttons"><button class="primary" id="cabinet" disabled>Открыть задачу</button><button id="show-browser" disabled>Показать браузер</button><button id="refresh" disabled>Обновить</button></div>
</main><!--SCRIPT--></body></html>
