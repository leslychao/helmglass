openapi: 3.1.0
info:
  title: Helm Glass application API
  version: 1.0.0
  description:
    Cookie-authenticated web cabinet REST API behind OAuth2 Proxy, with application
    authorization. MCP tools are served separately at /mcp and do not grant access to these WEB
    operations. GET /me establishes XSRF-TOKEN; web mutations send X-XSRF-TOKEN. Idempotency-Key is
    required only where declared; retain it when a mutation response is lost.
servers:
  - url: /api
security:
  - bearerAuth: []
  - webSession: []
paths:
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Current account; also establishes the XSRF-TOKEN cookie for web mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    post:
      operationId: saveProfile
      description: Atomically updates the display name and optional portrait. Email remains read-only. Portraits are PNG/JPEG/WebP, at most 5 MiB and 16 megapixels; omitted avatar preserves the current photo.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedVersion]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 300
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Saved profile or the receipt for an identical repeated operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "413":
          $ref: "#/components/responses/ApplicationError"
  /me/avatar:
    get:
      operationId: profileAvatar
      description: Original current portrait of the authenticated WEB account only; never a public file URL.
      parameters:
        - name: v
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Streamed original image with no-store and nosniff.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/ApplicationError"
  /tasks:
    get:
      operationId: tasks
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<Task>; counters are returned by /tasks/summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    post:
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Created draft or prepared task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/summary:
    get:
      operationId: taskSummary
      description: Uses all task list filters except status. Unknown is never represented as zero.
      responses:
        "200":
          description: "{active,succeeded,waitingForYou,total,sources:string[]}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: task
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: deleteDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Confirmed deletion: {deleted:true}; prepared tasks cannot be deleted individually."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: taskCommand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommand"
      responses:
        "200":
          description: Updated Task; COPY returns a new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: taskHistory
      description: Page size is always 10. Optional beforeSequence freezes the viewed history window.
      responses:
        "200":
          description: Page<{id,sequence,type,title,detail,createdAt}>
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: OR over history types.
        - name: beforeSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
  /tasks/{id}/result/rows:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: resultRows
      responses:
        "200":
          description: Page<{id,cells:object}>, server search/sort/page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultRowPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Direction"
        - name: sort
          in: query
          schema:
            type: string
          description: A published result column key; otherwise rows use their numeric id.
  /connections:
    get:
      operationId: connections
      responses:
        "200":
          description: Page<Connection>
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
    post:
      operationId: createConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                site:
                  type: string
                  maxLength: 253
                startUrl:
                  type: string
                  maxLength: 4096
              description:
                A nonblank startUrl or site is required. With only site, the server uses
                https://{site}/; stored site is derived from the validated URL.
              anyOf:
                - required:
                    - startUrl
                - required:
                    - site
        required: true
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: connection
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    patch:
      operationId: renameConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - expectedVersion
              properties:
                name:
                  type: string
                expectedVersion:
                  type: integer
        required: true
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: deleteConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Credentials deletion accepted: {deleted:true}; history and results remain."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /connections/{id}/login:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: connectionLogin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                viewerId:
                  type: string
                  format: uuid
                action:
                  type:
                    - string
                    - "null"
                  enum:
                    - START
                    - SAVE
                    - CLOSE
                    - null
                  default: START
                accountLabel:
                  type: string
                  maxLength: 300
                accountSubject:
                  type: string
                  maxLength: 500
              description:
                Omitted or null action defaults to START. START uses the tab-specific viewerId. SAVE
                requires viewerId and verified accountLabel/accountSubject. CLOSE terminates the
                standalone browser.
        required: true
      responses:
        "200":
          description: Connection, including its standalone browser when assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{id}/ticket:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: browserTicket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - viewerId
              properties:
                role:
                  type: string
                  enum:
                    - VIEWER
                    - CONTROLLER
                viewerId:
                  type: string
                  format: uuid
        required: true
      responses:
        "200":
          description: "{url,ticket,role,expiresAt}; single-use viewer ticket, never creates a browser."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{id}/control:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: browserControl
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - viewerId
              properties:
                type:
                  type: string
                  enum:
                    - TAKE
                    - RETURN
                    - BEGIN_LOGIN
                    - FINISH_LOGIN
                viewerId:
                  type: string
                  format: uuid
                resume:
                  type: boolean
                saveConnection:
                  type: boolean
                connectionId:
                  type: string
                  format: uuid
                accountLabel:
                  type: string
                accountSubject:
                  type: string
        required: true
      responses:
        "200":
          description: Browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Browser"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /artifacts/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: downloadArtifact
      responses:
        "200":
          description: Owner-authorized original file stream. MIME type is taken from the stored artifact.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename.
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /notifications:
    get:
      operationId: notifications
      responses:
        "200":
          description: "{items:[{id,sequence,taskId,title,status,createdAt}],total,throughSequence}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationInbox"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /notifications/read:
    post:
      operationId: readNotifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                throughSequence:
                  type: integer
                  format: int64
                  minimum: 0
              description:
                Specify id to mark one unread notification, or throughSequence>=0 for read-all at the
                captured cutoff. When id is supplied it takes precedence.
              anyOf:
                - required:
                    - id
                - required:
                    - throughSequence
        required: true
      responses:
        "200":
          description: Updated notification list; later sequences stay unread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationInbox"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /usage:
    get:
      operationId: usage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Timezone"
        - name: pageSize
          in: query
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 50
            default: 10
        - in: query
          name: daysPage
          schema:
            type: integer
            minimum: 1
            default: 1
            maximum: 1000000
        - in: query
          name: sitesPage
          schema:
            type: integer
            minimum: 1
            default: 1
            maximum: 1000000
      responses:
        "200":
          description:
            "{totalTasks,completedTasks,successfulTasks,successRate,usage,days,sites,statuses};
            creation-date cohort, cumulative consumption."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReport"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /events:
    get:
      operationId: events
      description:
        Authenticated SSE. Last-Event-ID or cursor query resumes committed events. Every
        subscription delivers committed replay in batches of at most 100 and then a sync event at
        its initial high-water mark, including reconnect with a cursor. No task contents in metadata
        events.
      responses:
        "200":
          description:
            "SSE framing: event: change; id: committed cursor; data is a JSON Change. sync marks
            completed replay at the initial high-water mark. Heartbeats do not contain business
            data."
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream whose change.data JSON validates against Change.
              example: |+
                id: 42
                event: change
                data: {"id":42,"resource":"sync","entityId":null,"version":0}

              x-event-data-schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Committed cursor; takes precedence over cursor query.
        - name: cursor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
  /admin/users/summary:
    get:
      operationId: adminUsersSummary
      description: Global counts independent of user-table filters; ADMIN web only. No user or task content is returned.
      responses:
        "200":
          description: Accounts excluding DELETED, BLOCKED accounts, and tasks waiting in QUEUED/WAITING_CHATGPT/WAITING_USER.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersSummary"
        "401":
          $ref: "#/components/responses/ApplicationError"
        "403":
          $ref: "#/components/responses/ApplicationError"
  /admin/users:
    get:
      operationId: adminUsers
      responses:
        "200":
          description: Page<AdminUser>; ADMIN web only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: flag
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - waiting
                - pending
            maxItems: 2
          description: Additional server filters; repeated flags combine.
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: adminUser
      parameters:
        - $ref: "#/components/parameters/Timezone"
        - name: taskPage
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            maximum: 1000000
        - name: auditPage
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            maximum: 1000000
        - name: taskPageSize
          in: query
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 50
            default: 20
        - name: auditPageSize
          in: query
          schema:
            type: integer
            enum:
              - 10
              - 20
              - 50
            default: 20
      responses:
        "200":
          description:
            "{user,usage: AdminUsage,tasks: Page<AdminTask>,operations,audit: Page<Audit>}; only
            service metadata. No private titles, goals, URLs, sites, results, or files."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDetail"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /admin/users/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminUserCommand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - LIMITS
                    - BLOCK
                    - UNBLOCK
                    - REQUEST_DELETION
                    - CANCEL_DELETION
                    - STOP_ALL
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                browserLimitMode:
                  type: string
                  enum:
                    - PLATFORM
                    - CUSTOM
                    - UNLIMITED
                browserLimit:
                  type: integer
                  minimum: 1
                expectedVersion:
                  type: integer
                waitingLimit:
                  type:
                    - integer
                    - "null"
                  minimum: 0
              description:
                expectedVersion is required for LIMITS, BLOCK, UNBLOCK, REQUEST_DELETION and
                CANCEL_DELETION. A nonblank reason (1..1000) is required for all except STOP_ALL.
                CUSTOM browserLimit must be >=1. Null waitingLimit means no individual waiting
                limit; zero still permits drafts.
        required: true
      responses:
        "200":
          description: AdminUser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /admin/nodes:
    get:
      operationId: adminNodes
      responses:
        "200":
          description: "[{id,name,status,occupied,capacity,browsers:[{id,taskId,ownerId,ownerName,status}]}]"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /admin/nodes/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminNodeCommand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - reason
              properties:
                type:
                  type: string
                  enum:
                    - DRAIN
                    - ENABLE
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
        required: true
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /admin/browsers/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminStopBrowser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Confirmed stop request receipt; task remains STOPPING until worker confirms closure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopReceipt"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /admin/audit:
    get:
      operationId: adminAudit
      responses:
        "200":
          description: Page<{id,actor,target,action,reason,before,after,status,createdAt}>; 365-day retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - name: action
          in: query
          description: Filter by one or more administrative actions; repeated or comma-separated values.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: user
          in: query
          schema:
            type: string
            format: uuid
  /connections/sites:
    get:
      operationId: connectionSites
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<string>; exact total of matching saved-connection sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/sites:
    get:
      operationId: taskSites
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<string>; exact total of matching task sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: taskArtifacts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<Artifact>; exact total, authorized metadata only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /auth/logout:
    post:
      operationId: logout
      description:
        Revokes only the current WEB application session; caller follows redirectUrl to
        complete OIDC logout.
      responses:
        "200":
          description:
            "{status:COMPLETED|PENDING,redirectUrl:string|null,message:string|null}; local WEB
            revocation is committed even when viewer closure awaits retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /integrations/chatgpt:
    get:
      operationId: chatgptIntegration
      responses:
        "200":
          description:
            "{connected:boolean,endpoint:string,accountUrl:string,viewerClosePending:boolean,viewe\
            rCloseFailed:boolean}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatgptIntegration"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /integrations/chatgpt/revoke:
    post:
      operationId: revokeChatgpt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description:
            "{revoked:true,status:COMPLETED|PENDING,message:string|null}; local MCP revocation is
            immediate, viewer closure is acknowledged or durably pending."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeReceipt"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
  parameters:
    Timezone:
      name: timezone
      in: query
      schema:
        type: string
        default: UTC
      description: IANA timezone for daily buckets and the administrative seven-calendar-day window.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 300
    Status:
      name: status
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    Site:
      name: site
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    Source:
      name: source
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    From:
      name: from
      in: query
      schema:
        anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
      description: Inclusive creation-time boundary. A date-only value starts at UTC midnight.
    To:
      name: to
      in: query
      schema:
        anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
      description:
        Exclusive instant boundary. A date-only value includes that complete UTC date by using
        the following midnight.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description:
        Resource-specific sort key. Task list defaults to updatedAt, connections to updatedAt,
        and admin users to lastAccessAt; unsupported keys use that resource default.
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
        maximum: 1000000
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum:
          - 10
          - 20
          - 50
        default: 20
  schemas:
    Page:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        pageSize:
          type: integer
          enum:
            - 10
            - 20
            - 50
      description:
        Pagination metadata. Concrete page schemas specify the item type. total counts the full
        matching set, not just this page.
    Me:
      type: object
      required:
        - id
        - name
        - email
        - roles
        - status
        - version
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - USER
              - ADMIN
          maxItems: 2
        status:
          $ref: "#/components/schemas/AccountStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        avatarUrl:
          type: [string, "null"]
          description: Authenticated relative URL of the current profile image, or null.
    TaskInput:
      type: object
      properties:
        goal:
          type: string
          maxLength: 20000
        title:
          type: string
          maxLength: 200
        startUrl:
          type:
            - string
            - "null"
          maxLength: 4096
          description: Absolute HTTP(S) URL without userinfo; null or omitted for an incomplete draft.
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
          default: TABLE
        requireConfirmation:
          type: boolean
          default: true
        preferredConnectionIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        prepare:
          type: boolean
          default: false
      description:
        Omitted values use the defaults. prepare=true requires a nonblank goal and startUrl. An
        incomplete draft may omit fields; startUrl can be null.
      allOf:
        - if:
            properties:
              prepare:
                const: true
            required:
              - prepare
          then:
            required:
              - goal
              - startUrl
            properties:
              goal:
                type: string
                minLength: 1
              startUrl:
                type: string
                minLength: 1
    TaskCommand:
      type: object
      required:
        - type
        - expectedVersion
      properties:
        goal:
          type: string
          maxLength: 20000
        title:
          type: string
          maxLength: 200
        startUrl:
          type:
            - string
            - "null"
          maxLength: 4096
          description: Absolute HTTP(S) URL without userinfo; null or omitted for an incomplete draft.
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
          default: TABLE
        requireConfirmation:
          type: boolean
          default: true
        preferredConnectionIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        type:
          $ref: "#/components/schemas/TaskCommandType"
        expectedVersion:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        requestVersion:
          type: integer
          format: int64
        text:
          type: string
          maxLength: 20000
        connectionId:
          type: string
          format: uuid
        viewerId:
          type: string
          format: uuid
        confirmBrowserLoss:
          type: boolean
        accountLabel:
          type: string
          maxLength: 300
        accountSubject:
          type: string
          maxLength: 500
        saveConnection:
          type: boolean
        resume:
          type: boolean
        outcome:
          type: string
          enum:
            - SUCCEEDED
            - PARTIAL
            - NOT_ACHIEVED
      description:
        expectedVersion is the observed Task version. Request responses require the current
        requestId/requestVersion. CHOOSE_CONNECTION requires connectionId validated against the
        persisted request scope. FINISH requires outcome and nonblank text. UNKNOWN_RESULT
        confirmation/rejection requires evidence text of at most 4000 characters. Browser control
        commands use the tab-specific viewerId. A stopped/closed/lost browser requires explicit
        confirmBrowserLoss before RESUME.
    Task:
      type: object
      required:
        - id
        - version
        - instructionRevision
        - title
        - goal
        - startUrl
        - site
        - outputFormat
        - requireConfirmation
        - preferredConnectionIds
        - source
        - status
        - outcome
        - waitReason
        - summary
        - request
        - browser
        - result
        - usage
        - allowedCommands
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        instructionRevision:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
        goal:
          type: string
        startUrl:
          type:
            - string
            - "null"
        site:
          type:
            - string
            - "null"
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
        requireConfirmation:
          type: boolean
        preferredConnectionIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        source:
          type: string
          enum:
            - WEB
            - MCP
        status:
          $ref: "#/components/schemas/TaskStatus"
        outcome:
          anyOf:
            - type: string
              enum:
                - SUCCEEDED
                - PARTIAL
                - NOT_ACHIEVED
            - type: "null"
        waitReason:
          type:
            - string
            - "null"
        summary:
          type: string
        request:
          anyOf:
            - $ref: "#/components/schemas/InteractionRequest"
            - type: "null"
        browser:
          anyOf:
            - $ref: "#/components/schemas/Browser"
            - type: "null"
        result:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
        usage:
          $ref: "#/components/schemas/Usage"
        allowedCommands:
          type: array
          items:
            $ref: "#/components/schemas/TaskCommandType"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      description:
        Application JSON error. Field validation errors may include fieldErrors; proxy and
        authentication middleware can reject a request before this application envelope is produced.
    InteractionRequest:
      description:
        ACCOUNT_CHOICE options are at most 50 exact preferred candidates; empty options use the
        paginated connections list restricted to the current task site and READY status. Selection
        is checked against the persisted request ID/version and scope.
      type: object
      required:
        - id
        - type
        - prompt
        - version
        - options
        - operationId
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - QUESTION
            - CONFIRMATION
            - ACCOUNT_CHOICE
            - UNKNOWN_RESULT
            - BROWSER_LOST
            - LOGIN
        prompt:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        options:
          type: array
          items:
            type: object
            required:
              - id
              - label
            properties:
              id:
                type: string
              label:
                type: string
        operationId:
          type:
            - string
            - "null"
          format: uuid
    Browser:
      type: object
      required:
        - id
        - nodeId
        - status
        - controlOwner
        - controlEpoch
        - privateMode
        - currentUrl
        - canView
        - canControl
        - version
      properties:
        id:
          type: string
          format: uuid
        nodeId:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/BrowserStatus"
        controlOwner:
          type: string
          enum:
            - NONE
            - CHATGPT
            - USER
            - TRANSFERRING
        controlEpoch:
          type: integer
        privateMode:
          type: boolean
        currentUrl:
          type:
            - string
            - "null"
        canView:
          type: boolean
        canControl:
          type: boolean
        version:
          type: integer
      description:
        TRANSFERRING is a durable pending policy. Controller tickets work only after USER
        acknowledgement; entering or leaving private mode denies model observation during the
        transition.
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        site:
          type: string
        startUrl:
          type: string
        status:
          type: string
          enum:
            - LOGIN_REQUIRED
            - READY
            - DELETING
            - DELETED
        accountSubject:
          type:
            - string
            - "null"
        accountLabel:
          type:
            - string
            - "null"
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        browser:
          anyOf:
            - $ref: "#/components/schemas/Browser"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - version
        - name
        - site
        - startUrl
        - status
        - accountSubject
        - accountLabel
        - lastUsedAt
        - browser
        - createdAt
        - updatedAt
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mimeType:
          type: string
        status:
          type: string
          enum:
            - UPLOADING
            - READY
            - FAILED
        sizeBytes:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        sha256:
          type:
            - string
            - "null"
        complete:
          type: boolean
        sourceUrl:
          type:
            - string
            - "null"
        sourceRef:
          type:
            - string
            - "null"
        durationSeconds:
          type:
            - number
            - "null"
        downloadUrl:
          type: string
          description: Owner-authorized relative API path; possession of this URL alone does not grant access.
      required:
        - id
        - name
        - mimeType
        - status
        - sizeBytes
        - sha256
        - complete
        - sourceUrl
        - sourceRef
        - durationSeconds
        - downloadUrl
    Usage:
      type: object
      properties:
        browserSeconds:
          type: number
        executionSeconds:
          type: number
        manualSeconds:
          type: number
        mediaSeconds:
          type:
            - number
            - "null"
        mediaBytes:
          type: integer
          format: int64
          minimum: 0
        incomplete:
          type: boolean
      required:
        - browserSeconds
        - executionSeconds
        - manualSeconds
        - mediaSeconds
        - mediaBytes
        - incomplete
      description:
        Seconds are separate, potentially overlapping measures; mediaBytes counts original
        ready artifacts. Unknown audio duration is null and incomplete is true.
    UsageReport:
      type: object
      required:
        - totalTasks
        - successfulTasks
        - completedTasks
        - successRate
        - usage
        - days
        - sites
        - statuses
      properties:
        totalTasks:
          type: integer
          format: int64
          minimum: 0
        successfulTasks:
          type: integer
          format: int64
          minimum: 0
        completedTasks:
          type: integer
          format: int64
          minimum: 0
        successRate:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        usage:
          $ref: "#/components/schemas/Usage"
        days:
          $ref: "#/components/schemas/UsageDayPage"
        sites:
          $ref: "#/components/schemas/UsageSitePage"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/UsageState"
          maxItems: 14
    AdminUsage:
      type: object
      additionalProperties: false
      required:
        - totalTasks
        - successfulTasks
        - completedTasks
        - successRate
        - usage
      properties:
        totalTasks:
          type: integer
          format: int64
          minimum: 0
        successfulTasks:
          type: integer
          format: int64
          minimum: 0
        completedTasks:
          type: integer
          format: int64
          minimum: 0
        successRate:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        usage:
          $ref: "#/components/schemas/Usage"
    AdminUsersSummary:
      type: object
      additionalProperties: false
      required: [users, blocked, waitingTasks]
      properties:
        users:
          type: integer
          format: int64
          minimum: 0
        blocked:
          type: integer
          format: int64
          minimum: 0
        waitingTasks:
          type: integer
          format: int64
          minimum: 0
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        email:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        browserLimitMode:
          type: string
          enum:
            - PLATFORM
            - CUSTOM
            - UNLIMITED
        browserLimit:
          type:
            - integer
            - "null"
        waitingLimit:
          type:
            - integer
            - "null"
        browserCount:
          type:
            - integer
            - "null"
        waitingCount:
          type: integer
        lastAccessAt:
          type:
            - string
            - "null"
          format: date-time
        pendingOperations:
          type: integer
        deleteUntil:
          type:
            - string
            - "null"
          format: date-time
        previousStatus:
          anyOf:
            - type: string
              enum:
                - ACTIVE
                - BLOCKED
            - type: "null"
      required:
        - id
        - version
        - name
        - email
        - status
        - browserLimitMode
        - browserLimit
        - waitingLimit
        - browserCount
        - waitingCount
        - lastAccessAt
        - pendingOperations
        - deleteUntil
        - previousStatus
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        actor:
          type:
            - string
            - "null"
        target:
          type:
            - string
            - "null"
        action:
          type: string
        reason:
          type:
            - string
            - "null"
        before:
          type:
            - string
            - "null"
          description: Encoded JSON of administrative state only.
        after:
          type:
            - string
            - "null"
          description: Encoded JSON of administrative state only.
        status:
          type: string
      required:
        - id
        - createdAt
        - actor
        - target
        - action
        - reason
        - before
        - after
        - status
    Result:
      type: object
      required:
        - summary
        - limitations
        - sources
        - columns
        - artifactCount
      properties:
        summary:
          type: string
          maxLength: 20000
        limitations:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 4000
        sources:
          type: array
          maxItems: 100
          items:
            type: object
            required:
              - title
              - url
            properties:
              title:
                type: string
                maxLength: 500
              url:
                type: string
                maxLength: 4096
                description: HTTP or HTTPS without userinfo.
        columns:
          type: array
          maxItems: 100
          items:
            type: object
            required:
              - key
              - label
              - type
            properties:
              key:
                type: string
                pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
              label:
                type: string
                maxLength: 200
              type:
                type: string
                enum:
                  - string
                  - number
                  - boolean
                  - date
                  - url
        artifactCount:
          type: integer
          minimum: 0
      description:
        Artifact metadata is paginated at tasks/{id}/artifacts; rows at tasks/{id}/result/rows.
        Column schema is immutable after the first row. Dates use YYYY-MM-DD; cells are typed
        scalars or null.
    TaskStatus:
      type: string
      enum:
        - DRAFT
        - WAITING_CHATGPT
        - QUEUED
        - STARTING
        - RUNNING
        - WAITING_USER
        - PAUSING
        - PAUSED
        - STOPPING
        - STOPPED
        - SUCCEEDED
        - PARTIAL
        - NOT_ACHIEVED
        - FAILED
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - DELETION_PENDING
        - PURGING
        - DELETED
    BrowserStatus:
      type: string
      enum:
        - QUEUED
        - STARTING
        - LIVE
        - CLOSING
        - CLOSED
        - UNREACHABLE
        - LOST
    TaskCommandType:
      type: string
      enum:
        - PREPARE
        - AMEND
        - PAUSE
        - RESUME
        - STOP
        - END_SESSION
        - COPY
        - ANSWER
        - CONFIRM
        - REJECT
        - CHOOSE_CONNECTION
        - BEGIN_LOGIN
        - FINISH_LOGIN
        - TAKE_CONTROL
        - RETURN_CONTROL
        - FINISH
    TaskPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Task"
              maxItems: 50
    ConnectionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Connection"
              maxItems: 50
    ArtifactPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Artifact"
              maxItems: 50
    SitePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                type: string
              maxItems: 50
    AdminUserPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminUser"
              maxItems: 50
    AuditPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Audit"
              maxItems: 50
    AdminTaskPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminTask"
              maxItems: 50
            total:
              type: integer
              format: int64
              minimum: 0
              maximum: 50
    UsageDay:
      type: object
      required:
        - date
        - tasks
        - browserSeconds
      properties:
        date:
          type: string
          format: date
        tasks:
          type: integer
          format: int64
          minimum: 0
        browserSeconds:
          type: number
          minimum: 0
    UsageSite:
      type: object
      required:
        - site
        - tasks
        - browserSeconds
        - mediaSeconds
        - mediaBytes
      properties:
        site:
          type:
            - string
            - "null"
        tasks:
          type: integer
          format: int64
          minimum: 0
        browserSeconds:
          type: number
          minimum: 0
        mediaSeconds:
          type:
            - number
            - "null"
          minimum: 0
        mediaBytes:
          type: integer
          format: int64
          minimum: 0
    UsageState:
      type: object
      required:
        - status
        - tasks
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
        tasks:
          type: integer
          format: int64
          minimum: 0
    UsageDayPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UsageDay"
              maxItems: 50
    UsageSitePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UsageSite"
              maxItems: 50
    AdminTask:
      type: object
      required:
        - id
        - status
        - browserId
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TaskStatus"
        browserId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    AdminOperation:
      type: object
      required:
        - id
        - status
        - description
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - RUNNING
            - FAILED
            - SUCCEEDED
            - CANCELLED
        description:
          type: string
    AdminDetail:
      type: object
      required:
        - user
        - usage
        - tasks
        - operations
        - audit
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        usage:
          $ref: "#/components/schemas/AdminUsage"
        tasks:
          $ref: "#/components/schemas/AdminTaskPage"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/AdminOperation"
          maxItems: 50
        audit:
          $ref: "#/components/schemas/AuditPage"
      description:
        Service metadata only. tasks covers the most recent 50 tasks and total is capped at 50.
        operations contains at most 50 unfinished jobs. usage is aggregate-only, with no sites, days
        or private task content.
    AdminBrowser:
      type: object
      required:
        - id
        - taskId
        - ownerId
        - ownerName
        - status
      properties:
        id:
          type: string
          format: uuid
        taskId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        ownerId:
          type: string
          format: uuid
        ownerName:
          type: string
        status:
          $ref: "#/components/schemas/BrowserStatus"
    Node:
      type: object
      required:
        - id
        - name
        - version
        - status
        - occupied
        - capacity
        - browsers
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
            - ONLINE
            - DRAINING
            - OFFLINE
        occupied:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        capacity:
          type: integer
          minimum: 0
        browsers:
          type: array
          items:
            $ref: "#/components/schemas/AdminBrowser"
    TaskSummary:
      type: object
      required:
        - active
        - succeeded
        - waitingForYou
        - total
        - sources
      properties:
        active:
          type: integer
          format: int64
          minimum: 0
        succeeded:
          type: integer
          format: int64
          minimum: 0
        waitingForYou:
          type: integer
          format: int64
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
        sources:
          type: array
          items:
            type: string
            enum:
              - WEB
              - MCP
          maxItems: 2
    History:
      type: object
      required:
        - id
        - sequence
        - type
        - title
        - detail
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        type:
          type: string
        title:
          type: string
        detail:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    HistoryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/History"
              maxItems: 10
            pageSize:
              type: integer
              const: 10
    ResultRow:
      type: object
      required:
        - id
        - cells
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
        cells:
          type: object
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
    ResultRowPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ResultRow"
              maxItems: 50
    Notification:
      type: object
      required:
        - id
        - sequence
        - taskId
        - title
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        taskId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        createdAt:
          type: string
          format: date-time
    NotificationInbox:
      type: object
      required:
        - items
        - total
        - throughSequence
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
          maxItems: 50
        total:
          type: integer
          format: int64
          minimum: 0
        throughSequence:
          type: integer
          format: int64
          minimum: 0
      description:
        At most the latest 50 unread notifications. total is the exact unread count;
        throughSequence is the current read-all cutoff.
    Ticket:
      type: object
      required:
        - url
        - ticket
        - role
        - expiresAt
      properties:
        url:
          type: string
        ticket:
          type: string
        role:
          type: string
          enum:
            - VIEWER
            - CONTROLLER
        expiresAt:
          type: string
          format: date-time
      description:
        Single-use handshake ticket; expiry does not close an established socket. A new ticket
        on disconnect keeps the same browser.
    Deleted:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          const: true
    StopReceipt:
      type: object
      required:
        - status
        - taskId
      properties:
        status:
          type: string
          const: STOPPING
        taskId:
          type: string
          format: uuid
    Logout:
      type: object
      required:
        - status
        - redirectUrl
        - message
      properties:
        status:
          type: string
          enum:
            - COMPLETED
            - PENDING
        redirectUrl:
          type:
            - string
            - "null"
        message:
          type:
            - string
            - "null"
    ChatgptIntegration:
      type: object
      required:
        - connected
        - endpoint
        - accountUrl
        - viewerClosePending
        - viewerCloseFailed
      properties:
        connected:
          type: boolean
        endpoint:
          type: string
          format: uri
        accountUrl:
          type: string
          format: uri
        viewerClosePending:
          type: boolean
        viewerCloseFailed:
          type: boolean
    RevokeReceipt:
      type: object
      required:
        - revoked
        - status
        - message
      properties:
        revoked:
          type: boolean
          const: true
        status:
          type: string
          enum:
            - COMPLETED
            - PENDING
        message:
          type:
            - string
            - "null"
    Change:
      type: object
      required:
        - id
        - resource
        - entityId
        - version
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        resource:
          type: string
          enum:
            - sync
            - task
            - history
            - browser
            - connection
            - notification
            - account
            - usage
            - integration
            - admin-user
            - admin-operation
            - admin-audit
            - node
            - artifact
            - operation
        entityId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        version:
          type: integer
          format: int64
          minimum: 0
  responses:
    ApplicationError:
      description: Application error; see code and message. Validation failures may identify fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
