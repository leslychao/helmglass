      type: string
      enum:
        - QUEUED
        - STARTING
        - LIVE
        - CLOSING
        - CLOSED
        - UNREACHABLE
        - LOST
    TaskCommandType:
      type: string
      description: >-
        CLOSE_BROWSER closes the task browser after dispatched work settles and preserves
        steps, results and an explicit pause. Closure is confirmed by the browser node;
        an unreachable node or UNKNOWN operation is not reported as a successful close.
        OPEN_BROWSER allocates a new browser and resumes the same task after it is ready,
        removing only the pause caused by browser closure. Other holds remain in force.
        It remains available after RESUME when the browser is CLOSED or LOST and an
        unfinished task still awaits verification of UNKNOWN. RESUME authorizes continuation;
        the next accepted browser read can also allocate the replacement browser.
        Both commands are available only in the authenticated web cabinet.
        TAKE_CONTROL enters manual control without starting a new login.
        BEGIN_LOGIN associates the same task browser with its canonical owned connection
        (creating it when absent), so login can be completed from the connection page.
        RETURN_CONTROL does not require saving the login session and preserves explicit
        pause and unresolved requests. FINISH_LOGIN remains compatible with existing clients.
      enum:
        - PREPARE
        - AMEND
        - RESUME
        - STOP
        - BEGIN_LOGIN
        - FINISH_LOGIN
        - TAKE_CONTROL
        - RETURN_CONTROL
        - CLOSE_BROWSER
        - OPEN_BROWSER
        - FINISH
