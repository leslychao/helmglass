openapi: 3.1.0
info:
  title: Helm Glass application API
  version: 1.0.0
  description:
    Cookie-authenticated web cabinet REST API behind OAuth2 Proxy, with application
    authorization. MCP tools are served separately at /mcp and do not grant access to these WEB
    operations. GET /me establishes XSRF-TOKEN; web mutations send X-XSRF-TOKEN. Idempotency-Key is
    required only where declared; retain it when a mutation response is lost.
servers:
  - url: /api
security:
  - bearerAuth: []
  - webSession: []
paths:
  /artifacts/{id}/analysis:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: analyzeAudio
      description: Idempotent by owner, artifact and processing version. Full upgrade preserves transcript and analysis ID. Does not control the task or browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [transcript, full]
      responses:
        "200":
          description: Current analysis state; processing is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioAnalysis"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
    get:
      operationId: latestAudioAnalysis
      responses:
        "200":
          description: Latest processing version for this artifact, if requested.
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
                  analysis:
                    $ref: "#/components/schemas/AudioAnalysis"
        "404":
          $ref: "#/components/responses/ApplicationError"
  /audio/analyses/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: audioAnalysisPage
      description: Text or structured data only. At most 100 elements and 64 KiB per page. hasMore concerns stored data; sectionComplete independently describes the computation.
      parameters:
        - name: section
          in: query
          schema:
            type: string
            enum: [transcript, intervals, acoustics, emotions]
            default: transcript
        - name: cursor
          in: query
          schema:
            type: string
            pattern: '^[0-9]{1,19}$'
            default: '0'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: from
          in: query
          description: Inclusive start of the requested time range in original seconds.
          schema: {type: number, minimum: 0}
        - name: to
          in: query
          description: Exclusive end, greater than from.
          schema: {type: number, minimum: 0}
      responses:
        "200":
          description: Analysis state and one bounded page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AudioAnalysis"
                  - type: object
                    required: [section, items, hasMore, nextCursor, sectionComplete]
                    properties:
                      section: {type: string, enum: [transcript, intervals, acoustics, emotions]}
                      items:
                        type: array
                        maxItems: 100
                        items:
                          type: object
                          required: [start, end]
                          properties:
                            start: {type: number, minimum: 0}
                            end: {type: number, minimum: 0}
                            text: {type: string}
                            timing: {type: string, enum: [ctc_estimate]}
                            kind: {type: string, enum: [speech, pause, loudness, pitch]}
                            rmsDbfs: {type: [number, 'null']}
                            peakDbfs: {type: [number, 'null']}
                            digitalSilence: {type: boolean}
                            f0Hz: {type: [number, 'null']}
                            strength: {type: number}
                            deltaHz: {type: [number, 'null']}
                            reason: {type: [string, 'null']}
                            scores:
                              type: [object, 'null']
                              additionalProperties: {type: number}
                              description: Native model class scores; not calibrated probabilities of a person's emotions.
                      hasMore: {type: boolean}
                      nextCursor: {type: [string, 'null']}
                      sectionComplete: {type: boolean}
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
  /me:
    get:
      operationId: me
      responses:
        "200":
          description: Current account; also establishes the XSRF-TOKEN cookie for web mutations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    post:
      operationId: saveProfile
      description: Atomically updates the display name and optional portrait. Email remains read-only. Portraits are PNG/JPEG/WebP, at most 5 MiB and 16 megapixels; omitted avatar preserves the current photo.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedVersion]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 300
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Saved profile or the receipt for an identical repeated operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "413":
          $ref: "#/components/responses/ApplicationError"
  /me/avatar:
    get:
      operationId: profileAvatar
      description: Original current portrait of the authenticated WEB account only; never a public file URL.
      parameters:
        - name: v
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Streamed original image with no-store and nosniff.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "404":
          $ref: "#/components/responses/ApplicationError"
  /tasks:
    get:
      operationId: tasks
      parameters:
        - $ref: "#/components/parameters/TaskIdFilter"
        - $ref: "#/components/parameters/Suggestions"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<Task>; counters are returned by /tasks/summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    post:
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Created draft or prepared task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/summary:
    get:
      operationId: taskSummary
      description: Uses all task list filters except status. Unknown is never represented as zero.
      responses:
        "200":
          description: "{active,succeeded,waitingForYou,total,sources:string[]}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/TaskIdFilter"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: task
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: deleteDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Confirmed deletion: {deleted:true}; prepared tasks cannot be deleted individually."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: taskCommand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommand"
      responses:
        "200":
          description: Updated Task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/steps:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: taskSteps
      description: Agent tool invocations, newest first. Replaying a callId preserves identity and order. Page size is 10; beforeSequence fixes the viewed window, not step versions. Technical history is separate.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - name: beforeSequence
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Recorded agent tool invocations matching this query; total is not an estimated workload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStepPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/history:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: taskHistory
      description: Page size is always 10. Optional beforeSequence freezes the viewed history window.
      responses:
        "200":
          description: Page<{id,sequence,type,title,detail,createdAt}>
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: OR over history types.
        - name: beforeSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
  /tasks/{id}/result/rows:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: resultRows
      responses:
        "200":
          description: Page<{id,cells:object}>, server search/sort/page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultRowPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Direction"
        - name: sort
          in: query
          schema:
            type: string
          description: A published result column key; otherwise rows use their numeric id.
  /connections:
    get:
      operationId: connections
      responses:
        "200":
          description: Page<Connection>
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Site"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
    post:
      operationId: createConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                site:
                  type: string
                  maxLength: 253
                startUrl:
                  type: string
                  maxLength: 4096
              description:
                A nonblank startUrl or site is required. With only site, the server uses
                https://{site}/; stored site is derived from the validated URL.
              anyOf:
                - required:
                    - startUrl
                - required:
                    - site
        required: true
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /connections/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: connection
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    patch:
      operationId: renameConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - expectedVersion
              properties:
                name:
                  type: string
                expectedVersion:
                  type: integer
        required: true
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: deleteConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Credentials deletion accepted: {deleted:true}; history and results remain."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deleted"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /connections/{id}/login:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: connectionLogin
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                viewerId:
                  type: string
                  format: uuid
                pageVisitId:
                  type: string
                  format: uuid
                  description: Optional cabinet page visit, registered atomically with START.
                action:
                  type:
                    - string
                    - "null"
                  enum:
                    - START
                    - SAVE
                    - CLOSE
                    - null
                  default: START
                accountLabel:
                  type: string
                  maxLength: 300
                accountSubject:
                  type: string
                  maxLength: 500
              description:
                Omitted or null action defaults to START. START uses the tab-specific viewerId. SAVE
                requires viewerId and user-declared accountLabel/accountSubject. This legacy save also
                returns control; the v14 interface uses the independent browser login endpoint. CLOSE terminates the
                standalone browser.
        required: true
      responses:
        "200":
          description: Connection, including its standalone browser when assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{session}/pages/{visit}:
    parameters:
      - name: session
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: visit
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: openBrowserPage
      description: >-
        Register a task or connection browser page, or update its control epoch. WEB owner only.
        The authenticated events stream renews this visit; absence for 60 seconds ends it.
        Switching Chrome tabs or stopping the video stream does not end the page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [viewerId]
              properties:
                viewerId: { type: string, format: uuid }
      responses:
        "200":
          description: Page registered.
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean, const: true }
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: leaveBrowserPage
      description: >-
        End this page idempotently. The last page requests closure of a standalone browser.
        A task browser remains open; only this viewer's matching control epoch is returned,
        with automatic continuation unless another hold applies. Expiry without explicit leave
        releases control with the task paused. Incomplete login remains private.
        Closure uses normal worker confirmation.
      responses:
        "200":
          description: Page ended; browser or control teardown may still be completing.
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: { type: boolean, const: false }
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{session}/pages/{visit}/activity:
    parameters:
      - name: session
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: visit
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: browserPageActivity
      description: WEB owner only. Registers trusted manual input without key or field contents. Requires a live active controller visit and matching controlEpoch. Monotonic sequence deduplicates reports; observers, stale visits and MCP cannot extend a browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [controlEpoch, sequence]
              properties:
                controlEpoch: {type: integer, format: int64, minimum: 0}
                sequence: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Activity accepted or already recorded; only a new sequence extends the deadline.
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
  /admin/browsers/{id}/retry-cleanup:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: retryBrowserCleanup
      description: WEB administrator retries the same failed artifact delivery and cleanup of a confirmed stopped browser. Does not reopen execution. Recorded in the administrative audit.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cleanup scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Browser"
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{id}/keep-open:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: keepBrowserOpen
      description: Extend the same live task or connection browser from now by 5 minutes while waiting or 15 minutes under manual control. Does not resume the task or change control. A closing browser cannot be extended; an idempotent replay does not renew the deadline.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Browser deadline updated or protected while in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Browser"
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
  /browser-sessions/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: credentialMetadata
      description: WEB owner and current private controller only.
      parameters:
        - name: viewerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe metadata only; never returns username, password or browser state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "403":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
    post:
      operationId: setCredentialCapture
      description: Explicit consent for the current private controller and exact HTTPS origin. Captures only an unambiguous login submitted in the protected browser. Never receives credentials from Helmglass frontend; persistence occurs with Save login.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCaptureInput"
      responses:
        "200":
          description: Safe metadata only; never returns username, password or browser state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "403":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
    delete:
      operationId: deleteCredentials
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerId, expectedRevision]
              properties:
                viewerId:
                  type: string
                  format: uuid
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 9007199254740991
      responses:
        "200":
          description: Safe metadata only; never returns username, password or browser state.
