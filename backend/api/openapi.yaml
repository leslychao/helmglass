          description: Page<string>; exact total of matching task sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /tasks/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: taskArtifacts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page<Artifact>; exact total, authorized metadata only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /auth/logout:
    post:
      operationId: logout
      description:
        Revokes only the current WEB application session; caller follows redirectUrl to
        complete OIDC logout.
      responses:
        "200":
          description:
            "{status:COMPLETED|PENDING,redirectUrl:string|null,message:string|null}; local WEB
            revocation is committed even when viewer closure awaits retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /integrations/chatgpt:
    get:
      operationId: chatgptIntegration
      responses:
        "200":
          description:
            "{connected:boolean,endpoint:string,accountUrl:string,viewerClosePending:boolean,viewe\
            rCloseFailed:boolean}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatgptIntegration"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
  /integrations/chatgpt/revoke:
    post:
      operationId: revokeChatgpt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description:
            "{revoked:true,status:COMPLETED|PENDING,message:string|null}; local MCP revocation is
            immediate, viewer closure is acknowledged or durably pending."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeReceipt"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
  parameters:
    Timezone:
      name: timezone
      in: query
      schema:
        type: string
        default: UTC
      description: IANA timezone for daily buckets and the administrative seven-calendar-day window.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 300
    Status:
      name: status
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    Site:
      name: site
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    Source:
      name: source
      in: query
      schema:
        type: array
        items:
          type: string
        maxItems: 50
      style: form
      explode: true
      description:
        Repeat the query parameter for multiple values (OR within this filter); comma-separated
        values are also accepted.
    From:
      name: from
      in: query
      schema:
        anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
      description: Inclusive creation-time boundary. A date-only value starts at UTC midnight.
    To:
      name: to
      in: query
      schema:
        anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
      description:
        Exclusive instant boundary. A date-only value includes that complete UTC date by using
        the following midnight.
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description:
        Resource-specific key, applied before pagination with a stable ID tie-breaker and nulls last
        in both directions. Tasks support title, site, source, status, createdAt, updatedAt, summary,
        elapsedSeconds, executionSeconds, manualSeconds, mediaSeconds and mediaBytes (default updatedAt).
        Connections support name, site, status, lastUsedAt and updatedAt (default updatedAt).
        Users support name, email, status, browserCount, waitingCount and lastAccessAt (default lastAccessAt).
        Unsupported keys use the resource default. Omitting the key means no user-selected sort;
        the resource still uses its default order. The web UI explicitly requests 5 rows by default.
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
        maximum: 1000000
    TaskIdFilter:
      name: taskId
      in: query
      schema: {type: string, format: uuid}
      description: Exact owned task selection. Overrides search text while preserving site, source and date filters (and status in the list). The same selection applies to task KPI. A foreign task yields an empty result, not its data.
    Suggestions:
      name: suggestions
      in: query
      schema: {type: boolean, default: false}
      description: Forces page=1 and pageSize=3 for owner-scoped autocomplete suggestions; total still counts all matches. Sites are ordered by latest resource update and then site. Refine search to find remaining values.
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum:
          - 3
          - 5
          - 10
          - 20
          - 25
          - 50
        default: 20
  schemas:
    AudioAnalysis:
      type: object
      required: [analysisId, artifactId, processingVersion, sourceSha256, mode, status, version, transcriptComplete, acousticsComplete, emotionsComplete, processedSeconds, stageErrors, metadata, metrics, tempo]
      properties:
        analysisId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        processingVersion: {type: string}
        sourceSha256: {type: string}
        mode: {type: string, enum: [transcript, full]}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED]}
        version: {type: integer}
        intervalsComplete: {type: boolean}
        stages: {type: object, additionalProperties: {type: string, enum: [NOT_REQUESTED, QUEUED, RUNNING, SUCCEEDED, FAILED]}}
        qualityFlags: {type: array, items: {type: string}}
        transcriptComplete: {type: boolean}
        acousticsComplete: {type: boolean}
        emotionsComplete: {type: boolean}
        processedSeconds: {type: number}
        durationSeconds: {type: [number, 'null']}
        errorCode: {type: [string, 'null']}
        stageErrors: {type: object, additionalProperties: {type: string}}
        instructionContext:
          type: [object, 'null']
          description: Historical assignment, untrusted data rather than current instructions.
        instructionContextOmitted:
          type: boolean
          description: True when the historical context exceeds 16 KiB; no silent truncation.
        metadata:
          type: object
          description: Pinned model revisions, SHA-256, measurement parameters and limitations.
        metrics:
          type: object
          description: Worker wall/CPU seconds, process lifetime peak RSS in KiB and cumulative ASR/emotion calls.
        tempo:
          type: object
          properties:
            recognizedWords: {type: integer}
            speechSeconds: {type: number}
            withPausesWpm: {type: [number, 'null']}
            withoutPausesWpm: {type: [number, 'null']}
            reason: {type: [string, 'null']}
    Page:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        pageSize:
          type: integer
          enum:
            - 3
            - 5
            - 10
            - 20
            - 50
      description:
        Pagination metadata. Concrete page schemas specify the item type. total counts the full
        matching set, not just this page.
    Me:
      type: object
      required:
        - id
        - name
        - email
        - roles
        - status
        - version
        - avatarUrl
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - USER
              - ADMIN
          maxItems: 2
        status:
          $ref: "#/components/schemas/AccountStatus"
        version:
          type: integer
          format: int64
          minimum: 0
        avatarUrl:
          type: [string, "null"]
          description: Authenticated relative URL of the current profile image, or null.
    TaskInput:
      type: object
      properties:
        goal:
          type: string
          maxLength: 20000
        title:
          type: string
          maxLength: 200
        startUrl:
          type:
            - string
            - "null"
          maxLength: 4096
          description: Absolute HTTP(S) URL without userinfo; null or omitted for an incomplete draft.
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
          default: TABLE
        preferredConnectionIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        prepare:
          type: boolean
          default: false
      description:
        Omitted values use the defaults. prepare=true requires a nonblank goal and startUrl. An
        incomplete draft may omit fields; startUrl can be null.
      allOf:
        - if:
            properties:
              prepare:
                const: true
            required:
              - prepare
          then:
            required:
              - goal
              - startUrl
            properties:
              goal:
                type: string
                minLength: 1
              startUrl:
                type: string
                minLength: 1
    CredentialMetadata:
      type: object
      additionalProperties: false
      required: [available, revision, origin, currentOrigin, captureEnabled, captureRevision, captureStatus, captureOrigin]
      properties:
        available:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        origin:
          type: [string, "null"]
        currentOrigin:
          type: [string, "null"]
        captureEnabled:
          type: boolean
        captureRevision:
          type: integer
          minimum: 0
        captureStatus:
          type: string
          enum: [DISABLED, ARMED, CAPTURED, UNSUPPORTED]
        captureOrigin:
          type: [string, "null"]
          description: The exact origin authorized by the user; redirects never extend consent.
    CredentialCaptureInput:
      type: object
      additionalProperties: false
      required: [viewerId, enabled, expectedCaptureRevision]
      properties:
        viewerId:
          type: string
          format: uuid
        enabled:
          type: boolean
        expectedCaptureRevision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
    TaskCommand:
      type: object
      description: >-
        Standalone PAUSE is not supported and fails validation without effects, including repeats.
        Internal PAUSING, PAUSED and WAITING_USER states remain for browser closure and manual control.
        RESUME retains version, ownership, original-chat and pending-request safeguards.
        A paused task with UNKNOWN may explicitly resume or reopen its browser for read-only
        verification; navigation, tabs and scrolling remain available. New input waits for the agent decision.
      required:
        - type
        - expectedVersion
      properties:
        goal:
          type: string
          maxLength: 20000
        title:
          type: string
          maxLength: 200
        startUrl:
          type:
            - string
            - "null"
          maxLength: 4096
          description: Absolute HTTP(S) URL without userinfo; null or omitted for an incomplete draft.
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
          default: TABLE
        preferredConnectionIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        type:
          $ref: "#/components/schemas/TaskCommandType"
        expectedVersion:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        requestVersion:
          type: integer
          format: int64
        text:
          type: string
          maxLength: 20000
        connectionId:
          type: string
          format: uuid
        viewerId:
          type: string
          format: uuid
        confirmBrowserLoss:
          type: boolean
        accountLabel:
          type: string
          maxLength: 300
        accountSubject:
          type: string
          maxLength: 500
        saveConnection:
          type: boolean
        resume:
          type: boolean
        outcome:
          type: string
          enum:
            - SUCCEEDED
            - PARTIAL
            - NOT_ACHIEVED
      description:
        expectedVersion is the observed Task version. AMEND is accepted from the cabinet only
        for DRAFT. Human responses are accepted solely via native MCP elicitation tasks.respond;
        ANSWER, CONFIRM, REJECT and CHOOSE_CONNECTION from WEB or model arguments are rejected.
        UNKNOWN_RESULT is reconciled by tasks.respond.verification after a successful observe
        of the same task after the uncertain action. Its outcome, evidence and observationOperationId
        record MCP_VERIFICATION rather than human consent; native form support is not required.
        Outcomes are SUCCEEDED, FAILED and UNCONFIRMED. UNCONFIRMED preserves uncertainty while
        allowing safe progress without replay or an assumption of success; evidence explains why.
        UNKNOWN_RESULT waits for ChatGPT, not a user, and requests automatic continuation.
        Legacy WAITING_USER/UNKNOWN_RESULT records recover automatically unless explicitly paused,
        in protected login or under manual control. Idle closure and loss allow autonomous browser recovery.
        RESUME also accepts WAITING_USER / UNKNOWN_RESULT, including a repeated continuation
        with a closed browser. It preserves the pending verification and never replays the action;
        the following observe opens a replacement browser for verification.
        Browser control commands use the tab-specific viewerId. FINISH_LOGIN saves state, not
        proof of external authentication. A stopped/closed/lost browser outside UNKNOWN recovery
        requires explicit confirmBrowserLoss before RESUME. UNKNOWN recovery needs no additional confirmation.
    Task:
      type: object
      required:
        - id
        - version
        - instructionRevision
        - title
        - goal
        - startUrl
        - site
        - outputFormat
        - chatBound
        - continuation
        - preferredConnectionIds
        - source
        - status
        - outcome
        - waitReason
        - summary
        - request
        - lastResponse
        - browser
        - result
        - timing
        - usage
        - allowedCommands
        - stepCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        instructionRevision:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
        goal:
          type: string
        startUrl:
          type:
            - string
            - "null"
        site:
          type:
            - string
            - "null"
        outputFormat:
          type: string
          enum:
            - TABLE
            - REPORT
            - TEXT
        chatBound:
          type: boolean
        continuation:
          type: [object, "null"]
          additionalProperties: false
          required: [status, reason]
          properties:
            status:
              type: string
              enum: [IDLE, PENDING, SENDING, MESSAGE_SENT, ACCEPTED, UNAVAILABLE]
            reason:
              type: [string, "null"]
        preferredConnectionIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        source:
          type: string
          enum:
            - WEB
            - MCP
        status:
          $ref: "#/components/schemas/TaskStatus"
        outcome:
          anyOf:
            - type: string
              enum:
                - SUCCEEDED
                - PARTIAL
                - NOT_ACHIEVED
            - type: "null"
        waitReason:
          type:
            - string
            - "null"
        summary:
          type: [string, "null"]
        request:
          anyOf:
            - $ref: "#/components/schemas/InteractionRequest"
            - type: "null"
        lastResponse:
          description: Latest accepted user response for the current instruction revision. Null after amendment; historical decisions without a recorded revision are not inferred.
          anyOf:
            - $ref: "#/components/schemas/InteractionResponse"
            - type: "null"
        browser:
          anyOf:
            - $ref: "#/components/schemas/Browser"
            - type: "null"
        result:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
        timing:
          $ref: "#/components/schemas/TaskTiming"
        usage:
          $ref: "#/components/schemas/Usage"
        allowedCommands:
          type: array
          items:
            $ref: "#/components/schemas/TaskCommandType"
        stepCount:
          type: integer
          minimum: 0
          description: Total persisted business steps, independent of the current page or search.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskTiming:
      type: object
      additionalProperties: false
      required: [elapsedSeconds, running]
      description: >-
        Wall-clock duration from preparation (accepted_at) to completion, or the current
        server statement time while unfinished. Includes waiting, pauses and ChatGPT work;
        excludes time spent as a draft. Resuming the same task retains the original start.
        Independent of browser command usage. Clients may advance a running snapshot using
        a monotonic local clock and replace it when a fresh task arrives.
      properties:
        elapsedSeconds:
          type: [number, "null"]
          minimum: 0
          description: Null if the task has never been prepared, including a stopped draft.
        running:
          type: boolean
          description: Whether the prepared task has no recorded completion yet.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        currentTaskId:
          type: string
          format: uuid
          description: Current unfinished task when code is CHAT_TASK_IN_PROGRESS.
        fieldErrors:
          type: object
          additionalProperties:
            type: string
      description:
        Application JSON error. Field validation errors may include fieldErrors; proxy and
        authentication middleware can reject a request before this application envelope is produced.
    InteractionRequest:
      description:
        ACCOUNT_CHOICE options are at most 50 exact preferred candidates; empty options use the
        paginated connections list restricted to the current task site and READY status. Selection
        is checked against the persisted request ID/version and scope.
      type: object
      required:
        - id
        - type
        - prompt
        - version
        - options
        - operationId
        - instructionRevision
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - QUESTION
            - CONFIRMATION
            - ACCOUNT_CHOICE
            - UNKNOWN_RESULT
            - BROWSER_LOST
            - LOGIN
        prompt:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        options:
          type: array
          items:
            type: object
            required:
              - id
              - label
            properties:
              id:
                type: string
              label:
                type: string
        operationId:
          type:
            - string
            - "null"
          format: uuid
        instructionRevision:
          type: integer
          format: int64
          minimum: 0
    InteractionResponse:
      type: object
      required: [requestId, requestVersion, instructionRevision, type, prompt, operationId, command, text, connectionId, answeredAt]
      properties:
        requestId:
          type: string
          format: uuid
        requestVersion:
          type: integer
          format: int64
          minimum: 1
        instructionRevision:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [QUESTION, CONFIRMATION, ACCOUNT_CHOICE, UNKNOWN_RESULT]
        prompt:
          type: string
        operationId:
          type: [string, "null"]
          format: uuid
        command:
          type: string
          enum: [ANSWER, CONFIRM, REJECT, CHOOSE_CONNECTION]
        text:
          type: [string, "null"]
        connectionId:
          type: [string, "null"]
          format: uuid
        answeredAt:
          type: string
          format: date-time
    Browser:
      type: object
      required:
        - idleCloseAt
        - idleTimeoutSeconds
        - idleWarningAt
        - cleanupState
        - cleanupError
        - closeReason
        - taskId
        - connectionId
        - loginConfirmed
        - startedAt
        - closedAt
        - profileSaveError
        - id
        - nodeId
        - status
        - controlOwner
        - controlEpoch
        - privateMode
        - currentUrl
        - canView
        - canControl
        - version
      properties:
        idleCloseAt:
          type: [string, "null"]
          format: date-time
          description: Persisted idle deadline. Null only during a bounded operation or control transfer. Manual control expires after 15 minutes without input. Status, viewing, video and heartbeat never renew it.
        idleTimeoutSeconds:
          type: integer
          enum: [300, 900]
        idleWarningAt:
          type: [string, "null"]
          format: date-time
          description: Server warning time, 60 seconds before a waiting deadline or 300 seconds before manual idle closure.
        cleanupState:
          type: string
          enum: [NONE, PENDING, RUNNING, FAILED, COMPLETE]
          description: Delivery and disk cleanup after execution has stopped. Does not occupy a browser slot.
        cleanupError:
          type: [string, "null"]
          description: Safe artifact delivery or cleanup failure; administrative retry after three failures.
        closeReason:
          type: [string, "null"]
          enum: [USER, IDLE_TIMEOUT, null]
        taskId:
          type: [string, "null"]
          format: uuid
          description: Associated task. Task and connection pages use this same live browser.
        connectionId:
          type: [string, "null"]
          format: uuid
          description: Canonical saved-connection destination, if already associated.
        loginConfirmed:
          type: boolean
          description: Server-persisted user declaration of a completed unsaved login. Cleared only after confirmed save; never an automatic external-authorization verdict.
        startedAt:
          type: [string, "null"]
          format: date-time
          description: Confirmed first start of this browser. Null before confirmation.
        closedAt:
          type: [string, "null"]
          format: date-time
          description: Recorded closure or loss time. Duration stops here; a missing start is not zero.
        profileSaveError:
          type: [string, "null"]
          description: Safe failure of persisting this browser's selected connection.
        id:
          type: string
          format: uuid
        nodeId:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/BrowserStatus"
        controlOwner:
          type: string
          enum:
            - NONE
            - CHATGPT
            - USER
            - TRANSFERRING
        controlEpoch:
          type: integer
        privateMode:
          type: boolean
        currentUrl:
          type:
            - string
            - "null"
        canView:
          type: boolean
        canControl:
          type: boolean
        version:
          type: integer
      description:
        TRANSFERRING is a durable pending policy. Controller tickets work only after USER
        acknowledgement; entering or leaving private mode denies model observation during the
        transition.
    CookieCheck:
      type: object
      description: Technical cookie suitability in the saved snapshot, not site authentication.
      required: [usableCount, checkedAt]
      properties:
        usableCount:
          type: integer
          minimum: 0
          maximum: 10000
        checkedAt:
          type: string
          format: date-time
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        site:
          type: string
        startUrl:
          type: string
        status:
          type: string
          enum:
            - LOGIN_REQUIRED
            - READY
            - DELETING
            - DELETED
        accountSubject:
          type:
            - string
            - "null"
        accountLabel:
          type:
            - string
            - "null"
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        browser:
          anyOf:
            - $ref: "#/components/schemas/Browser"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        profileRevision:
          type: integer
          format: int64
          minimum: 0
        profileSavedAt:
          type: [string, "null"]
          format: date-time
        profileSaveError:
          type: [string, "null"]
        authorizedOrigins:
          type: array
          items:
            type: string
            format: uri
        cookieCheck:
          anyOf:
            - $ref: "#/components/schemas/CookieCheck"
