  /events:
    get:
      operationId: events
      description:
        Authenticated SSE. Last-Event-ID or cursor query resumes committed events. Every
        subscription delivers committed replay in batches of at most 100 and then a sync event at
        its initial high-water mark, including reconnect with a cursor. No task contents in metadata
        events.
      responses:
        "200":
          description:
            "SSE framing: event: change; id: committed cursor; data is a JSON Change. sync marks
            completed replay at the initial high-water mark. Heartbeats do not contain business
            data."
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream whose change.data JSON validates against Change.
              example: |+
                id: 42
                event: change
                data: {"id":42,"resource":"sync","entityId":null,"version":0}

              x-event-data-schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
        "500":
          $ref: "#/components/responses/ApplicationError"
      parameters:
        - name: browserVisit
          in: query
          schema: { type: string, format: uuid }
          description: >-
            Renews only an active connection page visit owned by the authenticated WEB account.
            A missing, closed or foreign visit is ignored and never affects the account event stream.
        - name: Last-Event-ID
          in: header
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Committed cursor; takes precedence over cursor query.
        - name: cursor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
