  /browser-sessions/{id}/login:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: browserSessionLogin
      description: >-
        FINISH_LOGIN is the single cabinet action: declare login complete, persist the canonical
        owned connection, then release control after confirmed persistence. It keeps the same
        browser and explicit task pause, resolves a LOGIN request, and preserves other requests.
        It requires the current private controller and controlEpoch. Failed persistence keeps
        protected control for recovery; success does not verify external authorization.
        CONFIRM_LOGIN and SAVE_SESSION remain supported for existing clients.
        CONFIRM_LOGIN only records the controller's declaration. SAVE_SESSION requires it and
        persists the canonical owned connection (creating the task's connection if needed).
        A saved account subject cannot be replaced. SAVE_SESSION keeps the same browser, private USER
        control, task pause and pending request. It neither closes the browser nor transfers control.
        The durable intent remains TRANSFERRING until confirmed; loginConfirmed becomes false only
        after successful persistence and control acknowledgement. An identical Idempotency-Key
        returns the original receipt; read current browser state to observe completion.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, viewerId, controlEpoch]
              properties:
                type:
                  type: string
                  enum: [FINISH_LOGIN, CONFIRM_LOGIN, SAVE_SESSION]
                viewerId:
                  type: string
                  format: uuid
                controlEpoch:
                  type: integer
                  format: int64
                accountLabel:
                  type: string
                  maxLength: 300
                  description: Optional account label. Omission preserves existing metadata; a first save needs no account fields.
                accountSubject:
                  type: string
                  maxLength: 500
                  description: Optional user-declared expected external account. Omission preserves existing metadata and does not claim a verified identity.
      responses:
        "200":
          description: Browser with a durable finish/save intent or confirmed login marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Browser"
        "400":
          $ref: "#/components/responses/ApplicationError"
        "403":
          $ref: "#/components/responses/ApplicationError"
        "404":
          $ref: "#/components/responses/ApplicationError"
        "409":
          $ref: "#/components/responses/ApplicationError"
